<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 336" width="100%" height="auto" role="img"
     aria-label="Dendrogramm des agglomerativen Clusterings von sechs Versicherungskunden A bis F. Die y-Achse zeigt die Verschmelzungshoehe als Distanz. Nacheinander verschmelzen E und F bei 500, A und B bei 1.000, C und D bei 1.500, dann C D mit E F bei 4.000 und zuletzt A B mit dem Rest bei 9.500. Eine gestrichelte Schnittlinie bei Hoehe 2.500 trennt drei Cluster: A B, C D und E F.">
  <title>Dendrogramm: agglomeratives Clustering mit Single Linkage und Schnitt bei h ≈ 2.500</title>

  <defs>
    <!-- Pfeilspitze fuer die y-Achse -->
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#1e1e1e" />
    </marker>
  </defs>

  <!-- ===================== Panel-Trenner ===================== -->
  <g stroke="#e8e8e8" stroke-width="1">
    <line x1="722" y1="8" x2="722" y2="324" />
  </g>

  <!-- ===================================================================
       PANEL 1 — Das Dendrogramm
       =================================================================== -->
  <g>
    <!-- Kopfzeile -->
    <rect x="20" y="6" width="24" height="22" rx="4" fill="#00c6b2" />
    <text x="32" y="21.5" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="700"
          fill="#ffffff" text-anchor="middle">1</text>
    <text x="52" y="22" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
          fill="#1e1e1e">Dendrogramm &#8211; wer verschmilzt wann?</text>

    <!-- Gridlines (5.000 / 7.500 / 10.000) -->
    <g stroke="#e8e8e8" stroke-width="1">
      <line x1="140" y1="154.8" x2="700" y2="154.8" />
      <line x1="140" y1="107.1" x2="700" y2="107.1" />
      <line x1="140" y1="59.5"  x2="700" y2="59.5" />
    </g>

    <!-- Achsen: y = Verschmelzungshoehe, x = Grundlinie der Blaetter -->
    <g stroke="#1e1e1e" stroke-width="2" stroke-linecap="square">
      <line x1="140" y1="250" x2="140" y2="46" marker-end="url(#axis-arrow)" />
      <line x1="140" y1="250" x2="700" y2="250" />
    </g>

    <!-- Achsenticks + Skala -->
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" fill="#4a4a4a">
      <g stroke="#1e1e1e" stroke-width="1.5">
        <line x1="136" y1="250"   x2="140" y2="250" />
        <line x1="136" y1="202.4" x2="140" y2="202.4" />
        <line x1="136" y1="154.8" x2="140" y2="154.8" />
        <line x1="136" y1="107.1" x2="140" y2="107.1" />
        <line x1="136" y1="59.5"  x2="140" y2="59.5" />
      </g>
      <text x="132" y="253"   text-anchor="end">0</text>
      <text x="132" y="205.4" text-anchor="end">2.500</text>
      <text x="132" y="157.8" text-anchor="end">5.000</text>
      <text x="132" y="110.1" text-anchor="end">7.500</text>
      <text x="132" y="62.5"  text-anchor="end">10.000</text>
    </g>

    <!-- Achsentitel -->
    <text x="86" y="148" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="600"
          fill="#1e1e1e" text-anchor="middle" transform="rotate(-90 86 148)">Verschmelzungsh&#246;he (Distanz)</text>

    <!-- ============ Teilbaum {A, B} — Cluster 1 (teal) ============ -->
    <g stroke="#00c6b2" stroke-width="2.5" stroke-linecap="round">
      <line x1="180" y1="250" x2="180" y2="231" /><!-- Blatt A -->
      <line x1="270" y1="250" x2="270" y2="231" /><!-- Blatt B -->
      <line x1="180" y1="231" x2="270" y2="231" /><!-- Verschmelzung bei 1.000 -->
      <line x1="225" y1="231" x2="225" y2="202.4" /><!-- Stamm bis zur Schnittlinie -->
    </g>

    <!-- ============ Teilbaum {C, D} — Cluster 2 (orange) ============ -->
    <g stroke="#e8734a" stroke-width="2.5" stroke-linecap="round">
      <line x1="360" y1="250" x2="360" y2="221.4" /><!-- Blatt C -->
      <line x1="450" y1="250" x2="450" y2="221.4" /><!-- Blatt D -->
      <line x1="360" y1="221.4" x2="450" y2="221.4" /><!-- Verschmelzung bei 1.500 -->
      <line x1="405" y1="221.4" x2="405" y2="202.4" /><!-- Stamm bis zur Schnittlinie -->
    </g>

    <!-- ============ Teilbaum {E, F} — Cluster 3 (blau) ============ -->
    <g stroke="#5a7d9a" stroke-width="2.5" stroke-linecap="round">
      <line x1="540" y1="250" x2="540" y2="240.5" /><!-- Blatt E -->
      <line x1="630" y1="250" x2="630" y2="240.5" /><!-- Blatt F -->
      <line x1="540" y1="240.5" x2="630" y2="240.5" /><!-- Verschmelzung bei 500 -->
      <line x1="585" y1="240.5" x2="585" y2="202.4" /><!-- Stamm bis zur Schnittlinie -->
    </g>

    <!-- ============ Verschmelzungen OBERHALB der Schnittlinie (grau) ============ -->
    <g stroke="#9e9e9e" stroke-width="2.5" stroke-linecap="round">
      <line x1="225" y1="202.4" x2="225" y2="69" /><!-- Stamm {A,B} nach oben -->
      <line x1="405" y1="202.4" x2="405" y2="173.8" /><!-- Stamm {C,D} nach oben -->
      <line x1="585" y1="202.4" x2="585" y2="173.8" /><!-- Stamm {E,F} nach oben -->
      <line x1="405" y1="173.8" x2="585" y2="173.8" /><!-- {C,D} + {E,F} bei 4.000 -->
      <line x1="495" y1="173.8" x2="495" y2="69" /><!-- Stamm {C,D,E,F} -->
      <line x1="225" y1="69" x2="495" y2="69" /><!-- Wurzel: alles bei 9.500 -->
    </g>

    <!-- Verschmelzungsknoten -->
    <g stroke="#ffffff" stroke-width="1.4">
      <circle cx="585" cy="240.5" r="3.6" fill="#5a7d9a" />
      <circle cx="225" cy="231"   r="3.6" fill="#00c6b2" />
      <circle cx="405" cy="221.4" r="3.6" fill="#e8734a" />
      <circle cx="495" cy="173.8" r="3.6" fill="#9e9e9e" />
      <circle cx="360" cy="69"    r="3.6" fill="#9e9e9e" />
    </g>

    <!-- Hoehenangaben an den Verschmelzungen -->
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="600">
      <text x="636" y="244"   fill="#5a7d9a">500</text>
      <text x="276" y="234.5" fill="#00c6b2">1.000</text>
      <text x="456" y="225"   fill="#e8734a">1.500</text>
      <text x="591" y="177.3" fill="#757575">4.000</text>
      <text x="501" y="72.5"  fill="#757575">9.500</text>
    </g>

    <!-- ============ Schnittlinie bei h = 2.500 ============ -->
    <line x1="140" y1="202.4" x2="700" y2="202.4" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 5" />
    <!-- Callout -->
    <line x1="640" y1="150" x2="662" y2="200" stroke="#757575" stroke-width="1.2" stroke-dasharray="3 3" />
    <rect x="546" y="104" width="160" height="44" rx="4" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.5" />
    <text x="626" y="121" font-family="Montserrat, Helvetica, sans-serif" font-size="10.5" font-weight="700"
          fill="#1e1e1e" text-anchor="middle">Schnitt bei h &#8776; 2.500</text>
    <text x="626" y="137" font-family="Montserrat, Helvetica, sans-serif" font-size="10.5" font-weight="700"
          fill="#00a294" text-anchor="middle">&#8594; 3 Cluster</text>

    <!-- ============ Blaetter A-F ============ -->
    <!-- Zeilenbeschriftung der Merkmalswerte -->
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9" fill="#9e9e9e" text-anchor="end">
      <text x="132" y="271">Alter</text>
      <text x="132" y="282">km/Jahr</text>
      <text x="132" y="293">Unf&#228;lle</text>
    </g>
    <!-- A -->
    <circle cx="180" cy="250" r="9" fill="#00c6b2" stroke="#ffffff" stroke-width="2" />
    <text x="180" y="253.9" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" fill="#4a4a4a" text-anchor="middle">
      <text x="180" y="271">24</text><text x="180" y="282">20.000</text><text x="180" y="293">2</text>
    </g>
    <!-- B -->
    <circle cx="270" cy="250" r="9" fill="#00c6b2" stroke="#ffffff" stroke-width="2" />
    <text x="270" y="253.9" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" fill="#4a4a4a" text-anchor="middle">
      <text x="270" y="271">26</text><text x="270" y="282">19.000</text><text x="270" y="293">2</text>
    </g>
    <!-- C -->
    <circle cx="360" cy="250" r="9" fill="#e8734a" stroke="#ffffff" stroke-width="2" />
    <text x="360" y="253.9" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" fill="#4a4a4a" text-anchor="middle">
      <text x="360" y="271">42</text><text x="360" y="282">9.500</text><text x="360" y="293">0</text>
    </g>
    <!-- D -->
    <circle cx="450" cy="250" r="9" fill="#e8734a" stroke="#ffffff" stroke-width="2" />
    <text x="450" y="253.9" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" fill="#4a4a4a" text-anchor="middle">
      <text x="450" y="271">45</text><text x="450" y="282">8.000</text><text x="450" y="293">1</text>
    </g>
    <!-- E -->
    <circle cx="540" cy="250" r="9" fill="#5a7d9a" stroke="#ffffff" stroke-width="2" />
    <text x="540" y="253.9" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" fill="#4a4a4a" text-anchor="middle">
      <text x="540" y="271">58</text><text x="540" y="282">4.000</text><text x="540" y="293">0</text>
    </g>
    <!-- F -->
    <circle cx="630" cy="250" r="9" fill="#5a7d9a" stroke="#ffffff" stroke-width="2" />
    <text x="630" y="253.9" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">F</text>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" fill="#4a4a4a" text-anchor="middle">
      <text x="630" y="271">62</text><text x="630" y="282">3.500</text><text x="630" y="293">0</text>
    </g>

    <!-- ============ Klammern der drei Cluster ============ -->
    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 172 300 L 172 305 L 278 305 L 278 300" stroke="#00c6b2" />
      <path d="M 352 300 L 352 305 L 458 305 L 458 300" stroke="#e8734a" />
      <path d="M 532 300 L 532 305 L 638 305 L 638 300" stroke="#5a7d9a" />
    </g>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">
      <text x="225" y="320" fill="#00a294">Cluster 1</text>
      <text x="405" y="320" fill="#e8734a">Cluster 2</text>
      <text x="585" y="320" fill="#5a7d9a">Cluster 3</text>
    </g>
  </g>

  <!-- ===================================================================
       PANEL 2 — Verschmelzungsreihenfolge und Ergebnis
       =================================================================== -->
  <g>
    <!-- Kopfzeile -->
    <rect x="740" y="6" width="24" height="22" rx="4" fill="#00c6b2" />
    <text x="752" y="21.5" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="700"
          fill="#ffffff" text-anchor="middle">2</text>
    <text x="772" y="22" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
          fill="#1e1e1e">Verschmelzungsreihenfolge</text>

    <!-- Tabellenkopf -->
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="600" fill="#9e9e9e">
      <text x="772" y="50">Schritt &#8211; verschmolzene Gruppen</text>
      <text x="1052" y="50" text-anchor="end">H&#246;he</text>
    </g>
    <line x1="740" y1="56" x2="1052" y2="56" stroke="#e8e8e8" stroke-width="1" />

    <!-- Schritt 1: E + F -->
    <rect x="740" y="62" width="14" height="14" rx="3" fill="#5a7d9a" />
    <text x="747" y="73" font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="764" y="73" font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#1e1e1e">E + F</text>
    <text x="1052" y="73" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#5a7d9a" text-anchor="end">500</text>

    <!-- Schritt 2: A + B -->
    <rect x="740" y="86" width="14" height="14" rx="3" fill="#00c6b2" />
    <text x="747" y="97" font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="764" y="97" font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#1e1e1e">A + B</text>
    <text x="1052" y="97" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#00a294" text-anchor="end">1.000</text>

    <!-- Schritt 3: C + D -->
    <rect x="740" y="110" width="14" height="14" rx="3" fill="#e8734a" />
    <text x="747" y="121" font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="764" y="121" font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#1e1e1e">C + D</text>
    <text x="1052" y="121" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#e8734a" text-anchor="end">1.500</text>

    <!-- Trenner: ab hier oberhalb der Schnittlinie -->
    <line x1="740" y1="132" x2="1052" y2="132" stroke="#1e1e1e" stroke-width="1.5" stroke-dasharray="6 4" />
    <text x="1052" y="145" font-family="Montserrat, Helvetica, sans-serif" font-size="9" fill="#757575" text-anchor="end">oberhalb des Schnitts &#8211; wird nicht mehr genutzt</text>

    <!-- Schritt 4 -->
    <rect x="740" y="152" width="14" height="14" rx="3" fill="#9e9e9e" />
    <text x="747" y="163" font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="764" y="163" font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#757575">{C, D} + {E, F}</text>
    <text x="1052" y="163" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#757575" text-anchor="end">4.000</text>

    <!-- Schritt 5 -->
    <rect x="740" y="176" width="14" height="14" rx="3" fill="#9e9e9e" />
    <text x="747" y="187" font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="764" y="187" font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#757575">{A, B} + {C, D, E, F}</text>
    <text x="1052" y="187" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#757575" text-anchor="end">9.500</text>

    <!-- Ergebnisbox -->
    <rect x="740" y="202" width="312" height="76" rx="4" fill="#f5f5f5" stroke="#00c6b2" stroke-width="2" />
    <text x="752" y="220" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e1e1e">Ergebnis beim Schnitt h &#8776; 2.500</text>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="10" fill="#4a4a4a">
      <circle cx="758" cy="235" r="4.5" fill="#00c6b2" />
      <text x="770" y="238.5"><tspan font-weight="700" fill="#1e1e1e">{A, B}</tspan> &#8211; junge Vielfahrer, 2 Unf&#228;lle</text>
      <circle cx="758" cy="253" r="4.5" fill="#e8734a" />
      <text x="770" y="256.5"><tspan font-weight="700" fill="#1e1e1e">{C, D}</tspan> &#8211; mittleres Alter, mittlere Fahrleistung</text>
      <circle cx="758" cy="271" r="4.5" fill="#5a7d9a" />
      <text x="770" y="274.5"><tspan font-weight="700" fill="#1e1e1e">{E, F}</tspan> &#8211; &#228;ltere Wenigfahrer, unfallfrei</text>
    </g>

    <!-- Bildunterschrift -->
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="10.5">
      <text x="740" y="298" font-weight="600" fill="#1e1e1e">Kein k vorab n&#246;tig.</text>
      <text x="740" y="312" fill="#4a4a4a">Der Algorithmus verschmilzt immer die zwei &#228;hnlichsten Gruppen.</text>
      <text x="740" y="326" fill="#4a4a4a">Erst die Schnitth&#246;he legt fest, wie viele Cluster herauskommen.</text>
    </g>
  </g>
</svg>
