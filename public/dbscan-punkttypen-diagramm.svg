<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 336" width="100%" height="auto" role="img"
     aria-label="Streudiagramm von sechs Versicherungskunden A bis F mit Fahreralter auf der x-Achse und Jahreskilometern auf der y-Achse. Um A und um D ist jeweils ein gestrichelter Kreis mit dem Radius Epsilon gleich 4 gezeichnet. Im Kreis um A liegen B und C, sie bilden Cluster 1 aus drei Kernpunkten. Im Kreis um D liegt E, beide bilden Cluster 2. Der Kreis um F bleibt leer, F ist damit ein Rauschpunkt und wird keinem Cluster zugeordnet. Rechts erklaert eine Legende die drei Punkttypen Kernpunkt, Randpunkt und Rauschpunkt.">
  <title>DBSCAN: Kernpunkt, Randpunkt und Rauschpunkt am Beispiel von sechs Versicherungskunden (&#949; = 4, MinPts = 2)</title>

  <defs>
    <!-- Pfeilspitzen fuer die Achsen -->
    <marker id="dbscan-axis-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#1e1e1e" />
    </marker>
    <!-- Pfeilspitze fuer die Radiuslinie -->
    <marker id="dbscan-eps-arrow" markerWidth="7" markerHeight="7" refX="5.6" refY="2.6" orient="auto">
      <polygon points="0 0, 6.5 2.6, 0 5.2" fill="#e8734a" />
    </marker>
  </defs>

  <!-- ===================== Panel-Trenner ===================== -->
  <line x1="722" y1="8" x2="722" y2="324" stroke="#e8e8e8" stroke-width="1" />

  <!-- ===================================================================
       PANEL 1 - Streudiagramm der sechs Kunden
       Massstab: 1 Merkmalseinheit = 8,6 px auf BEIDEN Achsen,
       damit der Epsilon-Radius als echter Kreis erscheint.
       x = 100 + (Alter - 20) * 8,6      y = 262 - km * 8,6
       =================================================================== -->
  <g>
    <!-- Kopfzeile -->
    <rect x="20" y="6" width="24" height="22" rx="4" fill="#00c6b2" />
    <text x="32" y="21.5" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="700"
          fill="#ffffff" text-anchor="middle">1</text>
    <text x="52" y="22" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
          fill="#1e1e1e">Sechs Kunden im Merkmalsraum &#8212; <tspan fill="#00a294">&#949; = 4</tspan>, <tspan fill="#00a294">MinPts = 2</tspan></text>

    <!-- Zeichenflaeche -->
    <rect x="100" y="50" width="606" height="250" rx="4" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.5" />

    <!-- Gridlines (5 / 10 / 15 / 20 Tsd. km) -->
    <g stroke="#e8e8e8" stroke-width="1">
      <line x1="100" y1="219.0" x2="706" y2="219.0" />
      <line x1="100" y1="176.0" x2="706" y2="176.0" />
      <line x1="100" y1="133.0" x2="706" y2="133.0" />
      <line x1="100" y1="90.0"  x2="706" y2="90.0" />
    </g>

    <!-- Achsen -->
    <g stroke="#1e1e1e" stroke-width="2" stroke-linecap="square">
      <line x1="100" y1="300" x2="100" y2="46" marker-end="url(#dbscan-axis-arrow)" />
      <line x1="100" y1="300" x2="716" y2="300" marker-end="url(#dbscan-axis-arrow)" />
    </g>

    <!-- y-Ticks (Jahreskilometer) -->
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" fill="#4a4a4a">
      <g stroke="#1e1e1e" stroke-width="1.5">
        <line x1="96" y1="262.0" x2="100" y2="262.0" />
        <line x1="96" y1="219.0" x2="100" y2="219.0" />
        <line x1="96" y1="176.0" x2="100" y2="176.0" />
        <line x1="96" y1="133.0" x2="100" y2="133.0" />
        <line x1="96" y1="90.0"  x2="100" y2="90.0" />
      </g>
      <text x="92" y="265.5" text-anchor="end">0</text>
      <text x="92" y="222.5" text-anchor="end">5</text>
      <text x="92" y="179.5" text-anchor="end">10</text>
      <text x="92" y="136.5" text-anchor="end">15</text>
      <text x="92" y="93.5"  text-anchor="end">20</text>
    </g>

    <!-- x-Ticks (Fahreralter) -->
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" fill="#4a4a4a" text-anchor="middle">
      <g stroke="#1e1e1e" stroke-width="1.5">
        <line x1="100" y1="300" x2="100" y2="304" />
        <line x1="186" y1="300" x2="186" y2="304" />
        <line x1="272" y1="300" x2="272" y2="304" />
        <line x1="358" y1="300" x2="358" y2="304" />
        <line x1="444" y1="300" x2="444" y2="304" />
        <line x1="530" y1="300" x2="530" y2="304" />
        <line x1="616" y1="300" x2="616" y2="304" />
        <line x1="702" y1="300" x2="702" y2="304" />
      </g>
      <text x="100" y="315">20</text>
      <text x="186" y="315">30</text>
      <text x="272" y="315">40</text>
      <text x="358" y="315">50</text>
      <text x="444" y="315">60</text>
      <text x="530" y="315">70</text>
      <text x="616" y="315">80</text>
      <text x="702" y="315">90</text>
    </g>

    <!-- Achsentitel -->
    <text x="403" y="331" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="600"
          fill="#1e1e1e" text-anchor="middle">Fahreralter (Jahre)</text>
    <text x="58" y="175" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="600"
          fill="#1e1e1e" text-anchor="middle" transform="rotate(-90 58 175)">Jahreskilometer (Tsd. km/Jahr)</text>

    <!-- ============ Epsilon-Umgebungen (gestrichelt, Radius 4 * 8,6 = 34,4 px) ============ -->
    <!-- um A: enthaelt B und C -> A ist Kernpunkt -->
    <circle cx="143.0" cy="133.0" r="34.4" fill="#00c6b2" fill-opacity="0.07"
            stroke="#00c6b2" stroke-width="1.8" stroke-dasharray="5 4" />
    <!-- um D: enthaelt E -> D ist Kernpunkt -->
    <circle cx="401.0" cy="193.2" r="34.4" fill="#e8734a" fill-opacity="0.07"
            stroke="#e8734a" stroke-width="1.8" stroke-dasharray="5 4" />
    <!-- um F: bleibt leer -> F ist Rauschen -->
    <circle cx="633.2" cy="261.1" r="34.4" fill="#9e9e9e" fill-opacity="0.05"
            stroke="#9e9e9e" stroke-width="1.8" stroke-dasharray="5 4" />

    <!-- Radiuslinie mit Beschriftung im Kreis um D -->
    <line x1="401.0" y1="193.2" x2="424.0" y2="170.2" stroke="#e8734a" stroke-width="1.5"
          stroke-linecap="round" marker-end="url(#dbscan-eps-arrow)" />
    <text x="429" y="166" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700"
          fill="#e8734a">&#949;</text>

    <!-- ============ Cluster 1 - A, B, C (Kreis-Symbol, teal) ============ -->
    <g stroke="#ffffff" stroke-width="1.6">
      <circle cx="143.0" cy="133.0" r="7" fill="#00c6b2" />
      <circle cx="151.6" cy="124.4" r="7" fill="#00c6b2" />
      <circle cx="160.2" cy="137.3" r="7" fill="#00c6b2" />
    </g>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#00a294">
      <text x="132" y="141" text-anchor="end">A</text>
      <text x="151.6" y="111" text-anchor="middle">B</text>
      <text x="175" y="158">C</text>
    </g>

    <!-- ============ Cluster 2 - D, E (Quadrat-Symbol, orange) ============ -->
    <g stroke="#ffffff" stroke-width="1.6">
      <rect x="394.5" y="186.7" width="13" height="13" rx="1.5" fill="#e8734a" />
      <rect x="403.1" y="191.0" width="13" height="13" rx="1.5" fill="#e8734a" />
    </g>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#e8734a">
      <text x="388" y="192" text-anchor="end">D</text>
      <text x="422" y="211">E</text>
    </g>

    <!-- ============ Rauschen - F (Kreuz-Symbol, grau) ============ -->
    <g stroke="#757575" stroke-width="3" stroke-linecap="round">
      <line x1="626.6" y1="254.5" x2="639.8" y2="267.7" />
      <line x1="639.8" y1="254.5" x2="626.6" y2="267.7" />
    </g>
    <text x="633.2" y="285" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700"
          fill="#757575" text-anchor="middle">F</text>

    <!-- ============ Annotationen ============ -->
    <!-- Epsilon-Radius -->
    <line x1="150" y1="88" x2="146" y2="99.5" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="3 3" />
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="10">
      <text x="112" y="84"><tspan font-weight="700" fill="#00a294">&#949;-Radius</tspan><tspan fill="#4a4a4a"> um A &#8212; hier liegen B und C</tspan></text>
    </g>

    <!-- Cluster 1 -->
    <line x1="196" y1="122" x2="178" y2="128" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="3 3" />
    <g font-family="Montserrat, Helvetica, sans-serif">
      <text x="200" y="120" font-size="11" font-weight="700" fill="#00a294">Cluster 1 = {A, B, C}</text>
      <text x="200" y="134" font-size="9.5" fill="#4a4a4a">alle drei sind <tspan font-weight="600" fill="#1e1e1e">Kernpunkte</tspan>:</text>
      <text x="200" y="146" font-size="9.5" fill="#4a4a4a">je &#8805; 2 Nachbarn im &#949;-Radius</text>
    </g>

    <!-- Cluster 2 -->
    <line x1="424" y1="246" x2="408" y2="229" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="3 3" />
    <g font-family="Montserrat, Helvetica, sans-serif">
      <text x="415" y="256" font-size="11" font-weight="700" fill="#e8734a">Cluster 2 = {D, E}</text>
      <text x="415" y="270" font-size="9.5" fill="#4a4a4a">beide <tspan font-weight="600" fill="#1e1e1e">Kernpunkte</tspan></text>
    </g>

    <!-- Rauschpunkt -->
    <line x1="662" y1="214" x2="648" y2="231" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="3 3" />
    <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="end">
      <text x="700" y="196" font-size="11" font-weight="700" fill="#757575">F = Rauschpunkt</text>
      <text x="700" y="210" font-size="9.5" fill="#4a4a4a">kein Nachbar im &#949;-Radius</text>
    </g>
  </g>

  <!-- ===================================================================
       PANEL 2 - Die drei Punkttypen
       =================================================================== -->
  <g>
    <!-- Kopfzeile -->
    <rect x="740" y="6" width="24" height="22" rx="4" fill="#00c6b2" />
    <text x="752" y="21.5" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="700"
          fill="#ffffff" text-anchor="middle">2</text>
    <text x="772" y="22" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
          fill="#1e1e1e">Die drei Punkttypen</text>

    <!-- Kernpunkt -->
    <circle cx="762" cy="64" r="17" fill="#00c6b2" fill-opacity="0.07" stroke="#00c6b2" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="752" cy="56" r="4" fill="#00c6b2" fill-opacity="0.5" />
    <circle cx="772" cy="72" r="4" fill="#00c6b2" fill-opacity="0.5" />
    <circle cx="762" cy="64" r="6" fill="#00c6b2" stroke="#ffffff" stroke-width="1.4" />
    <g font-family="Montserrat, Helvetica, sans-serif">
      <text x="792" y="55" font-size="11.5" font-weight="700" fill="#00a294">Kernpunkt</text>
      <text x="792" y="69" font-size="9.5" fill="#4a4a4a">hat mindestens MinPts Punkte im &#949;-Radius</text>
      <text x="792" y="81" font-size="9.5" fill="#757575">im Beispiel: A, B, C sowie D, E</text>
    </g>

    <!-- Randpunkt -->
    <circle cx="762" cy="124" r="17" fill="#00c6b2" fill-opacity="0.07" stroke="#00c6b2" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="762" cy="124" r="6" fill="#00c6b2" fill-opacity="0.35" stroke="#ffffff" stroke-width="1.4" />
    <circle cx="779" cy="124" r="5.5" fill="#ffffff" stroke="#00c6b2" stroke-width="2.2" />
    <g font-family="Montserrat, Helvetica, sans-serif">
      <text x="792" y="115" font-size="11.5" font-weight="700" fill="#00a294">Randpunkt</text>
      <text x="792" y="129" font-size="9.5" fill="#4a4a4a">selbst zu wenige Nachbarn, liegt aber im</text>
      <text x="792" y="141" font-size="9.5" fill="#4a4a4a">&#949;-Radius eines Kernpunkts &#8212; z&#228;hlt zum Cluster</text>
      <text x="792" y="153" font-size="9.5" fill="#757575">im Beispiel: kommt nicht vor (Schema links)</text>
    </g>

    <!-- Rauschpunkt -->
    <circle cx="762" cy="190" r="17" fill="#9e9e9e" fill-opacity="0.05" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3" />
    <g stroke="#757575" stroke-width="3" stroke-linecap="round">
      <line x1="756" y1="184" x2="768" y2="196" />
      <line x1="768" y1="184" x2="756" y2="196" />
    </g>
    <g font-family="Montserrat, Helvetica, sans-serif">
      <text x="792" y="181" font-size="11.5" font-weight="700" fill="#757575">Rauschpunkt</text>
      <text x="792" y="195" font-size="9.5" fill="#4a4a4a">weder Kern- noch Randpunkt &#8212; bleibt</text>
      <text x="792" y="207" font-size="9.5" fill="#4a4a4a">ohne Cluster</text>
      <text x="792" y="219" font-size="9.5" fill="#757575">im Beispiel: F</text>
    </g>

    <!-- Ergebnisbox -->
    <rect x="740" y="228" width="320" height="76" rx="4" fill="#f5f5f5" stroke="#00c6b2" stroke-width="2" />
    <text x="752" y="246" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700"
          fill="#1e1e1e">Ergebnis mit &#949; = 4 und MinPts = 2</text>
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" fill="#4a4a4a">
      <circle cx="758" cy="261" r="4.5" fill="#00c6b2" />
      <text x="770" y="264.5"><tspan font-weight="700" fill="#1e1e1e">Cluster 1 = {A, B, C}</tspan> &#8212; junge Vielfahrer</text>
      <rect x="753.8" y="274.8" width="8.4" height="8.4" rx="1.2" fill="#e8734a" />
      <text x="770" y="282.5"><tspan font-weight="700" fill="#1e1e1e">Cluster 2 = {D, E}</tspan> &#8212; &#228;ltere Wenigfahrer</text>
      <g stroke="#757575" stroke-width="2.4" stroke-linecap="round">
        <line x1="754.5" y1="292.5" x2="761.5" y2="299.5" />
        <line x1="761.5" y1="292.5" x2="754.5" y2="299.5" />
      </g>
      <text x="770" y="299.5"><tspan font-weight="700" fill="#1e1e1e">Rauschen = {F}</tspan> &#8212; 82 Jahre, kaum gefahren</text>
    </g>

    <!-- Bildunterschrift -->
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="10.5">
      <text x="740" y="317" font-weight="600" fill="#1e1e1e">Kein k vorab n&#246;tig &#8212; die Clusterzahl ergibt sich.</text>
      <text x="740" y="331" fill="#4a4a4a">Ausrei&#223;er landen im Rauschen, statt ein Cluster zu verzerren.</text>
    </g>
  </g>
</svg>
