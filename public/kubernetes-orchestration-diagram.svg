<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="auto"
     role="img" aria-labelledby="titleKube descKube">
  <title id="titleKube">Kubernetes als deklarative Orchestrierung</title>
  <desc id="descKube">Der Nutzer deklariert einen Gewuenschten Zustand mit fuenf Replicas. Der Kubernetes Control Loop
  vergleicht diesen Soll-Zustand fortlaufend mit dem Ist-Zustand im Cluster, ersetzt ausgefallene Pods automatisch
  und skaliert die Anzahl der Replicas bei Lastspitzen von fuenf auf fuenfzig und danach wieder zurueck.</desc>

  <defs>
    <!-- Pfeilspitzen -->
    <marker id="ah-teal" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#00C6B2"/>
    </marker>
    <marker id="ah-grey" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#757575"/>
    </marker>
    <marker id="ah-teal-sm" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 8 2.5, 0 5" fill="#00C6B2"/>
    </marker>
  </defs>

  <!-- ================= ZEILE 1: Reconcile-Loop ================= -->

  <!-- Gewuenschter Zustand (Deklaration) -->
  <rect x="20" y="44" width="204" height="92" rx="4" fill="#f5f5f5" stroke="#00C6B2" stroke-width="2"/>
  <text x="122" y="68" font-family="Montserrat, sans-serif" font-size="14" font-weight="700"
        fill="#1a1a1a" text-anchor="middle">Gewünschter Zustand</text>
  <rect x="46" y="80" width="152" height="26" rx="4" fill="#ffffff" stroke="#e8e8e8" stroke-width="1.5"/>
  <text x="122" y="98" font-family="Fira Code, monospace" font-size="14" font-weight="500"
        fill="#00C6B2" text-anchor="middle">replicas: 5</text>
  <text x="122" y="124" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">deklariert, nicht programmiert</text>

  <!-- Pfeil: Deklaration -> Control Loop -->
  <text x="273" y="80" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">SOLL</text>
  <line x1="228" y1="92" x2="318" y2="92" stroke="#00C6B2" stroke-width="2.5" marker-end="url(#ah-teal)"/>

  <!-- Kubernetes Control Loop (kreisender Abgleich) -->
  <circle cx="368" cy="90" r="52" fill="#ffffff" stroke="#e8e8e8" stroke-width="1.5"/>
  <path d="M 404.4 111 A 42 42 0 0 1 331.6 111" fill="none" stroke="#00C6B2" stroke-width="3"
        stroke-linecap="round" marker-end="url(#ah-teal)"/>
  <path d="M 331.6 69 A 42 42 0 0 1 404.4 69" fill="none" stroke="#00C6B2" stroke-width="3"
        stroke-linecap="round" marker-end="url(#ah-teal)"/>
  <text x="368" y="87" font-family="Montserrat, sans-serif" font-size="12.5" font-weight="700"
        fill="#1a1a1a" text-anchor="middle">Control</text>
  <text x="368" y="102" font-family="Montserrat, sans-serif" font-size="12.5" font-weight="700"
        fill="#1a1a1a" text-anchor="middle">Loop</text>
  <text x="368" y="160" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">beobachten · vergleichen · handeln</text>

  <!-- Pfeile: Control Loop <-> Cluster -->
  <text x="458" y="60" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">durchsetzen</text>
  <line x1="418" y1="68" x2="500" y2="68" stroke="#00C6B2" stroke-width="2.5" marker-end="url(#ah-teal)"/>
  <line x1="500" y1="120" x2="416" y2="120" stroke="#757575" stroke-width="2" marker-end="url(#ah-grey)"/>
  <text x="459" y="137" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">IST messen</text>

  <!-- Cluster (Ist-Zustand) -->
  <rect x="505" y="30" width="375" height="112" rx="4" fill="#ffffff" stroke="#e8e8e8" stroke-width="2"/>
  <text x="519" y="48" font-family="Montserrat, sans-serif" font-size="12" font-weight="700"
        fill="#1a1a1a">Cluster — Ist-Zustand</text>

  <!-- gesunde Pods -->
  <g font-family="Montserrat, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">
    <rect x="525" y="62" width="46" height="44" rx="4" fill="#00C6B2"/>
    <text x="548" y="89" fill="#ffffff">Pod</text>
    <rect x="579" y="62" width="46" height="44" rx="4" fill="#00C6B2"/>
    <text x="602" y="89" fill="#ffffff">Pod</text>
    <rect x="633" y="62" width="46" height="44" rx="4" fill="#00C6B2"/>
    <text x="656" y="89" fill="#ffffff">Pod</text>
    <rect x="687" y="62" width="46" height="44" rx="4" fill="#00C6B2"/>
    <text x="710" y="89" fill="#ffffff">Pod</text>
  </g>

  <!-- ausgefallener Pod (Self-Healing) -->
  <rect x="741" y="62" width="46" height="44" rx="4" fill="#ffffff" stroke="#ef4444"
        stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="753" y1="72" x2="775" y2="96" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="775" y1="72" x2="753" y2="96" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ersatz-Pod -->
  <line x1="791" y1="84" x2="810" y2="84" stroke="#00C6B2" stroke-width="2" marker-end="url(#ah-teal-sm)"/>
  <rect x="815" y="62" width="46" height="44" rx="4" fill="#00C6B2"/>
  <text x="838" y="85" font-family="Montserrat, sans-serif" font-size="11.5" font-weight="600"
        fill="#ffffff" text-anchor="middle">Pod</text>
  <text x="838" y="98" font-family="Montserrat, sans-serif" font-size="9" font-weight="600"
        fill="#bff1ec" text-anchor="middle">neu</text>

  <text x="692" y="128" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">Self-Healing: ausgefallener Pod wird automatisch ersetzt</text>

  <!-- ================= Trennlinie ================= -->
  <line x1="20" y1="172" x2="880" y2="172" stroke="#e8e8e8" stroke-width="1.5"/>

  <!-- ================= ZEILE 2: Autoscaling ================= -->
  <text x="20" y="194" font-family="Montserrat, sans-serif" font-size="12.5" font-weight="700"
        fill="#1a1a1a">Autoscaling — derselbe Loop, nur mit lastabhängigem Soll</text>

  <!-- Normallast -->
  <text x="120" y="222" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">Normallast</text>
  <g fill="#00C6B2">
    <rect x="94" y="254" width="8" height="8" rx="1.5"/>
    <rect x="105" y="254" width="8" height="8" rx="1.5"/>
    <rect x="116" y="254" width="8" height="8" rx="1.5"/>
    <rect x="127" y="254" width="8" height="8" rx="1.5"/>
    <rect x="138" y="254" width="8" height="8" rx="1.5"/>
  </g>
  <text x="120" y="294" font-family="Fira Code, monospace" font-size="12.5" font-weight="500"
        fill="#00C6B2" text-anchor="middle">replicas: 5</text>

  <!-- Pfeil: Lastspitze -->
  <text x="262" y="250" font-family="Montserrat, sans-serif" font-size="11"
        fill="#1a1a1a" text-anchor="middle" font-weight="600">Sturmnacht: Schadenmeldungen ×10</text>
  <line x1="162" y1="262" x2="368" y2="262" stroke="#00C6B2" stroke-width="2.5" marker-end="url(#ah-teal)"/>
  <text x="262" y="280" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">Soll wird hochgesetzt</text>

  <!-- Lastspitze: 50 Replicas (10 x 5 Raster) -->
  <text x="420" y="222" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">Lastspitze</text>
  <g fill="#00C6B2">
    <!-- Reihe 1 -->
    <rect x="379" y="238" width="6" height="6" rx="1"/><rect x="387.5" y="238" width="6" height="6" rx="1"/>
    <rect x="396" y="238" width="6" height="6" rx="1"/><rect x="404.5" y="238" width="6" height="6" rx="1"/>
    <rect x="413" y="238" width="6" height="6" rx="1"/><rect x="421.5" y="238" width="6" height="6" rx="1"/>
    <rect x="430" y="238" width="6" height="6" rx="1"/><rect x="438.5" y="238" width="6" height="6" rx="1"/>
    <rect x="447" y="238" width="6" height="6" rx="1"/><rect x="455.5" y="238" width="6" height="6" rx="1"/>
    <!-- Reihe 2 -->
    <rect x="379" y="248.5" width="6" height="6" rx="1"/><rect x="387.5" y="248.5" width="6" height="6" rx="1"/>
    <rect x="396" y="248.5" width="6" height="6" rx="1"/><rect x="404.5" y="248.5" width="6" height="6" rx="1"/>
    <rect x="413" y="248.5" width="6" height="6" rx="1"/><rect x="421.5" y="248.5" width="6" height="6" rx="1"/>
    <rect x="430" y="248.5" width="6" height="6" rx="1"/><rect x="438.5" y="248.5" width="6" height="6" rx="1"/>
    <rect x="447" y="248.5" width="6" height="6" rx="1"/><rect x="455.5" y="248.5" width="6" height="6" rx="1"/>
    <!-- Reihe 3 -->
    <rect x="379" y="259" width="6" height="6" rx="1"/><rect x="387.5" y="259" width="6" height="6" rx="1"/>
    <rect x="396" y="259" width="6" height="6" rx="1"/><rect x="404.5" y="259" width="6" height="6" rx="1"/>
    <rect x="413" y="259" width="6" height="6" rx="1"/><rect x="421.5" y="259" width="6" height="6" rx="1"/>
    <rect x="430" y="259" width="6" height="6" rx="1"/><rect x="438.5" y="259" width="6" height="6" rx="1"/>
    <rect x="447" y="259" width="6" height="6" rx="1"/><rect x="455.5" y="259" width="6" height="6" rx="1"/>
    <!-- Reihe 4 -->
    <rect x="379" y="269.5" width="6" height="6" rx="1"/><rect x="387.5" y="269.5" width="6" height="6" rx="1"/>
    <rect x="396" y="269.5" width="6" height="6" rx="1"/><rect x="404.5" y="269.5" width="6" height="6" rx="1"/>
    <rect x="413" y="269.5" width="6" height="6" rx="1"/><rect x="421.5" y="269.5" width="6" height="6" rx="1"/>
    <rect x="430" y="269.5" width="6" height="6" rx="1"/><rect x="438.5" y="269.5" width="6" height="6" rx="1"/>
    <rect x="447" y="269.5" width="6" height="6" rx="1"/><rect x="455.5" y="269.5" width="6" height="6" rx="1"/>
    <!-- Reihe 5 -->
    <rect x="379" y="280" width="6" height="6" rx="1"/><rect x="387.5" y="280" width="6" height="6" rx="1"/>
    <rect x="396" y="280" width="6" height="6" rx="1"/><rect x="404.5" y="280" width="6" height="6" rx="1"/>
    <rect x="413" y="280" width="6" height="6" rx="1"/><rect x="421.5" y="280" width="6" height="6" rx="1"/>
    <rect x="430" y="280" width="6" height="6" rx="1"/><rect x="438.5" y="280" width="6" height="6" rx="1"/>
    <rect x="447" y="280" width="6" height="6" rx="1"/><rect x="455.5" y="280" width="6" height="6" rx="1"/>
  </g>
  <text x="420" y="302" font-family="Fira Code, monospace" font-size="12.5" font-weight="500"
        fill="#00C6B2" text-anchor="middle">replicas: 50</text>

  <!-- Pfeil: zurueck -->
  <text x="586" y="250" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">Last sinkt</text>
  <line x1="486" y1="262" x2="688" y2="262" stroke="#757575" stroke-width="2" marker-end="url(#ah-grey)"/>
  <text x="586" y="280" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">Soll wird zurückgesetzt</text>

  <!-- Zurueck auf Normallast -->
  <text x="740" y="222" font-family="Montserrat, sans-serif" font-size="11"
        fill="#757575" text-anchor="middle">danach automatisch zurück</text>
  <g fill="#00C6B2">
    <rect x="714" y="254" width="8" height="8" rx="1.5"/>
    <rect x="725" y="254" width="8" height="8" rx="1.5"/>
    <rect x="736" y="254" width="8" height="8" rx="1.5"/>
    <rect x="747" y="254" width="8" height="8" rx="1.5"/>
    <rect x="758" y="254" width="8" height="8" rx="1.5"/>
  </g>
  <text x="740" y="294" font-family="Fira Code, monospace" font-size="12.5" font-weight="500"
        fill="#00C6B2" text-anchor="middle">replicas: 5</text>
</svg>
