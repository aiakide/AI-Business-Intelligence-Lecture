<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 250" width="100%" height="auto" role="img"
     aria-label="Schematischer Aufbau eines CF-Trees. Ganz oben steht ein Wurzelknoten. Darunter liegen zwei interne Knoten, die jeweils ein Clustering Feature CF tragen und nur den Weg nach unten weisen. Auf der untersten Ebene liegen vier Blattknoten, die je ein CF als kompakte Zusammenfassung einer Punktgruppe enthalten. Von links zeigt ein gestrichelter Pfeil von einem neuen Datenpunkt auf den ersten Blattknoten: Der Punkt wird in einem Durchlauf eingeordnet und das CF dieses Blattes wird aktualisiert.">
  <title>CF-Tree: schematischer Aufbau und Einf&#252;gen eines neuen Datenpunkts</title>

  <defs>
    <!-- Pfeilspitze fuer den einzufuegenden Datenpunkt -->
    <marker id="cf-insert-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#00c6b2" />
    </marker>
  </defs>

  <!-- ===================================================================
       KANTEN (zuerst gezeichnet, damit die Knoten darueber liegen)
       =================================================================== -->
  <g stroke="#9e9e9e" stroke-width="2" stroke-linecap="round">
    <!-- Wurzel -> interne Knoten -->
    <line x1="455" y1="62" x2="305" y2="101" />
    <line x1="455" y1="62" x2="605" y2="101" />
    <!-- interner Knoten links -> Blaetter 1 und 2 -->
    <line x1="305" y1="135" x2="230" y2="178" />
    <line x1="305" y1="135" x2="380" y2="178" />
    <!-- interner Knoten rechts -> Blaetter 3 und 4 -->
    <line x1="605" y1="135" x2="530" y2="178" />
    <line x1="605" y1="135" x2="680" y2="178" />
  </g>

  <!-- ===================================================================
       EBENE 0 — Wurzel
       =================================================================== -->
  <rect x="395" y="26" width="120" height="36" rx="4" fill="#ffffff" stroke="#1e1e1e" stroke-width="2" />
  <text x="455" y="49.5" font-family="Montserrat, Helvetica, sans-serif" font-size="13.5" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">Wurzel</text>

  <!-- ===================================================================
       EBENE 1 — interne Knoten
       =================================================================== -->
  <g>
    <rect x="260" y="101" width="90" height="34" rx="4" fill="#f5f5f5" stroke="#00c6b2" stroke-width="2" />
    <text x="305" y="123.5" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
          fill="#1e1e1e" text-anchor="middle">CF</text>

    <rect x="560" y="101" width="90" height="34" rx="4" fill="#f5f5f5" stroke="#00c6b2" stroke-width="2" />
    <text x="605" y="123.5" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
          fill="#1e1e1e" text-anchor="middle">CF</text>
  </g>

  <!-- ===================================================================
       EBENE 2 — Blattknoten (das erste Blatt ist das Einfuegeziel)
       =================================================================== -->
  <g>
    <!-- Blatt 1 — hervorgehoben: hier wird der neue Punkt einsortiert -->
    <rect x="187" y="178" width="86" height="36" rx="4" fill="#00c6b2" stroke="#00c6b2" stroke-width="2" />
    <text x="230" y="201.5" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
          fill="#ffffff" text-anchor="middle">CF</text>

    <!-- Blatt 2 -->
    <rect x="337" y="178" width="86" height="36" rx="4" fill="#ffffff" stroke="#00c6b2" stroke-width="2" />
    <text x="380" y="201.5" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
          fill="#1e1e1e" text-anchor="middle">CF</text>

    <!-- Blatt 3 -->
    <rect x="487" y="178" width="86" height="36" rx="4" fill="#ffffff" stroke="#00c6b2" stroke-width="2" />
    <text x="530" y="201.5" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
          fill="#1e1e1e" text-anchor="middle">CF</text>

    <!-- Blatt 4 -->
    <rect x="637" y="178" width="86" height="36" rx="4" fill="#ffffff" stroke="#00c6b2" stroke-width="2" />
    <text x="680" y="201.5" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
          fill="#1e1e1e" text-anchor="middle">CF</text>
  </g>

  <!-- ===================================================================
       NEUER DATENPUNKT — Single-Pass-Einfuegen
       =================================================================== -->
  <g>
    <text x="95" y="170" font-family="Montserrat, Helvetica, sans-serif" font-size="11.5" font-weight="700"
          fill="#1e1e1e" text-anchor="middle">neuer Datenpunkt</text>
    <circle cx="95" cy="196" r="7" fill="#00c6b2" stroke="#ffffff" stroke-width="2" />
    <line x1="108" y1="196" x2="180" y2="196" stroke="#00c6b2" stroke-width="2"
          stroke-dasharray="6 4" stroke-linecap="round" marker-end="url(#cf-insert-arrow)" />
    <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" text-anchor="middle">
      <text x="95" y="224" fill="#4a4a4a">wird eingeordnet,</text>
      <text x="95" y="239" font-weight="700" fill="#00a294">CF wird aktualisiert</text>
    </g>
  </g>

  <!-- ===================================================================
       EBENENBESCHRIFTUNG (rechts, ruhig und knapp)
       =================================================================== -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11.5" fill="#4a4a4a">
    <text x="790" y="48">
      <tspan font-weight="700" fill="#1e1e1e">Wurzel &#8211;</tspan> Einstieg jeder Einf&#252;gung
    </text>
    <text x="790" y="122">
      <tspan font-weight="700" fill="#1e1e1e">interne Knoten &#8211;</tspan> weisen nur den Weg nach unten
    </text>
    <text x="790" y="192">
      <tspan font-weight="700" fill="#1e1e1e">Blattknoten &#8211;</tspan> je ein CF als kompakte
    </text>
    <text x="790" y="208">Zusammenfassung einer Punktgruppe</text>
  </g>

  <!-- feine Trennlinie zwischen Baum und Beschriftung -->
  <line x1="762" y1="26" x2="762" y2="214" stroke="#e8e8e8" stroke-width="1" />
</svg>
