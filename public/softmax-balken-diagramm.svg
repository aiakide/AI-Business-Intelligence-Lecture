<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 452" width="100%" height="auto"
     role="img" aria-labelledby="smxTitle smxDesc">
  <title id="smxTitle">Softmax wandelt beliebige Raw-Ausgaben in eine Wahrscheinlichkeitsverteilung um</title>
  <desc id="smxDesc">Zwei Balkendiagramme f&#252;r die zehn MNIST-Klassen 0 bis 9. Links die Raw-Ausgaben des Netzes als graue Balken, die von minus 1,5 bis plus 2,1 reichen und auch negative Werte enthalten; sie sind keine Wahrscheinlichkeiten. Rechts dieselben Werte nach Softmax als t&#252;rkise Balken, alle zwischen 0 und 1 und in Summe genau 1. Klasse 0 hat mit 2,1 den h&#246;chsten Rohwert und erh&#228;lt mit 0,35 auch die h&#246;chste Wahrscheinlichkeit, gefolgt von Klasse 6 mit 0,18 und Klasse 3 mit 0,12.</desc>

  <defs>
    <marker id="smx-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#00c6b2" />
    </marker>
  </defs>
  <!-- Panel-&#220;berschriften -->
  <text x="183.0" y="52" font-family="Montserrat, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e1e1e" text-anchor="middle">Raw Output (Logits)</text>
  <text x="183.0" y="72" font-family="Montserrat, Helvetica, sans-serif" font-size="12" fill="#757575" text-anchor="middle">beliebige Zahlen, auch negativ</text>
  <text x="517.0" y="52" font-family="Montserrat, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#00a294" text-anchor="middle">Nach Softmax</text>
  <text x="517.0" y="72" font-family="Montserrat, Helvetica, sans-serif" font-size="12" fill="#757575" text-anchor="middle">Wahrscheinlichkeiten, Summe = 1</text>
