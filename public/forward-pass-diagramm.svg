<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="100%" height="auto"
     role="img" aria-labelledby="fwdTitle fwdDesc">
  <title id="fwdTitle">Forward Pass: Datenfluss von der Input- zur Output-Schicht</title>
  <desc id="fwdDesc">Vier nummerierte Schritte f&#252;hren von links nach rechts durch das Netz.
  Schritt 1: Die drei Eingaben Fahreralter 25, Schadenshistorie 3 und Fahrzeugtyp 1 werden in die Input-Schicht gegeben.
  Schritt 2: In der Hidden-Schicht berechnet jedes Neuron die gewichtete Summe z gleich W mal x plus b und wendet
  darauf die Aktivierungsfunktion Sigma an. Schritt 3: Das Output-Neuron bildet erneut eine gewichtete Summe und
  wendet Sigma an. Schritt 4: Als Vorhersage ergibt sich eine Betrugswahrscheinlichkeit von 66 Prozent.
  Ein durchgehender Pfeil am unteren Rand betont die Flussrichtung von links nach rechts.</desc>

  <defs>
    <marker id="fwd-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#00c6b2" />
    </marker>
    <marker id="fwd-arrow-big" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#00c6b2" />
    </marker>
  </defs>

  <!-- ===================================================================
       SCHRITT-BADGES UND -BESCHRIFTUNGEN
       =================================================================== -->
  <g>
    <circle cx="170" cy="34" r="14" fill="#00c6b2" />
    <circle cx="400" cy="34" r="14" fill="#00c6b2" />
    <circle cx="610" cy="34" r="14" fill="#00c6b2" />
    <circle cx="724" cy="34" r="14" fill="#00c6b2" />
  </g>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
     fill="#ffffff" text-anchor="middle">
    <text x="170" y="39">1</text>
    <text x="400" y="39">2</text>
    <text x="610" y="39">3</text>
    <text x="724" y="39">4</text>
  </g>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="700"
     fill="#1e1e1e" text-anchor="middle">
    <text x="170" y="68">Eingabe</text>
    <text x="400" y="68">Hidden-Schicht</text>
    <text x="610" y="68">Output-Neuron</text>
    <text x="724" y="68">Vorhersage</text>
  </g>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="middle">
    <text x="170" y="85">[25, 3, 1]</text>
    <text x="400" y="85">z = Wx + b &#8594; a = &#963;(z)</text>
    <text x="610" y="85">z<tspan font-size="8.5" dy="2.5">out</tspan><tspan dy="-2.5"> &#8594; &#963;(z</tspan><tspan font-size="8.5" dy="2.5">out</tspan><tspan dy="-2.5">)</tspan></text>
    <text x="724" y="85">Wahrscheinlichkeit</text>
  </g>

  <!-- ===================================================================
       SCHICHT-BAENDER
       =================================================================== -->
  <g fill="#f5f5f5">
    <rect x="140" y="135" width="60" height="220" rx="30" />
    <rect x="370" y="95"  width="60" height="300" rx="30" />
    <rect x="580" y="215" width="60" height="60"  rx="30" />
  </g>

  <!-- ===================================================================
       VERBINDUNGEN (Signalfluss, in Flussrichtung eingefaerbt)
       =================================================================== -->
  <g stroke="#8fdcd3" stroke-width="1.5">
    <line x1="170" y1="165" x2="400" y2="125" />
    <line x1="170" y1="165" x2="400" y2="185" />
    <line x1="170" y1="165" x2="400" y2="245" />
    <line x1="170" y1="165" x2="400" y2="305" />
    <line x1="170" y1="165" x2="400" y2="365" />
    <line x1="170" y1="245" x2="400" y2="125" />
    <line x1="170" y1="245" x2="400" y2="185" />
    <line x1="170" y1="245" x2="400" y2="245" />
    <line x1="170" y1="245" x2="400" y2="305" />
    <line x1="170" y1="245" x2="400" y2="365" />
    <line x1="170" y1="325" x2="400" y2="125" />
    <line x1="170" y1="325" x2="400" y2="185" />
    <line x1="170" y1="325" x2="400" y2="245" />
    <line x1="170" y1="325" x2="400" y2="305" />
    <line x1="170" y1="325" x2="400" y2="365" />

    <line x1="400" y1="125" x2="610" y2="245" />
    <line x1="400" y1="185" x2="610" y2="245" />
    <line x1="400" y1="245" x2="610" y2="245" />
    <line x1="400" y1="305" x2="610" y2="245" />
    <line x1="400" y1="365" x2="610" y2="245" />
  </g>

  <!-- ===================================================================
       SCHRITT 1 — INPUT MIT KONKRETEN WERTEN
       =================================================================== -->
  <g>
    <circle cx="170" cy="165" r="18" fill="#e8e8e8" stroke="#00c6b2" stroke-width="2.5" />
    <circle cx="170" cy="245" r="18" fill="#e8e8e8" stroke="#00c6b2" stroke-width="2.5" />
    <circle cx="170" cy="325" r="18" fill="#e8e8e8" stroke="#00c6b2" stroke-width="2.5" />
  </g>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="13" font-weight="700"
     fill="#1e1e1e" text-anchor="middle">
    <text x="170" y="170">25</text>
    <text x="170" y="250">3</text>
    <text x="170" y="330">1</text>
  </g>
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="end">
    <text x="132" y="162" font-size="12.5" font-weight="600" fill="#1e1e1e">Fahreralter</text>
    <text x="132" y="178" font-size="11" fill="#00a294">x&#8321; = 25</text>
    <text x="132" y="242" font-size="12.5" font-weight="600" fill="#1e1e1e">Schadenshistorie</text>
    <text x="132" y="258" font-size="11" fill="#00a294">x&#8322; = 3</text>
    <text x="132" y="322" font-size="12.5" font-weight="600" fill="#1e1e1e">Fahrzeugtyp</text>
    <text x="132" y="338" font-size="11" fill="#00a294">x&#8323; = 1</text>
  </g>

  <!-- ===================================================================
       SCHRITT 2 — HIDDEN-SCHICHT
       =================================================================== -->
  <g fill="#ffffff" stroke="#00c6b2" stroke-width="2.5">
    <circle cx="400" cy="125" r="18" />
    <circle cx="400" cy="185" r="18" />
    <circle cx="400" cy="245" r="18" />
    <circle cx="400" cy="305" r="18" />
    <circle cx="400" cy="365" r="18" />
  </g>

  <!-- ===================================================================
       SCHRITT 3 — OUTPUT-NEURON
       =================================================================== -->
  <circle cx="610" cy="245" r="20" fill="#00c6b2" stroke="#00c6b2" stroke-width="2.5" />
  <text x="610" y="251" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
        fill="#ffffff" text-anchor="middle">&#963;</text>

  <!-- ===================================================================
       SCHRITT 4 — ERGEBNIS
       =================================================================== -->
  <line x1="634" y1="245" x2="662" y2="245" stroke="#00c6b2" stroke-width="2.5" stroke-linecap="round"
        marker-end="url(#fwd-arrow)" />
  <rect x="668" y="222" width="112" height="46" rx="4" fill="#00c6b2" stroke="#00c6b2" stroke-width="2" />
  <text x="724" y="252" font-family="Montserrat, Helvetica, sans-serif" font-size="19" font-weight="700"
        fill="#ffffff" text-anchor="middle">66 %</text>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11.5" font-weight="600"
     fill="#4a4a4a" text-anchor="middle">
    <text x="724" y="288">Betrugs-</text>
    <text x="724" y="303">wahrscheinlichkeit</text>
  </g>

  <!-- ===================================================================
       FLUSSRICHTUNG
       =================================================================== -->
  <line x1="120" y1="420" x2="716" y2="420" stroke="#00c6b2" stroke-width="3.5" stroke-linecap="round"
        marker-end="url(#fwd-arrow-big)" />
  <text x="420" y="412" font-family="Montserrat, Helvetica, sans-serif" font-size="13.5" font-weight="700"
        fill="#00a294" text-anchor="middle">Forward Pass</text>

  <text x="400" y="454" font-family="Montserrat, Helvetica, sans-serif" font-size="11.5"
        fill="#4a4a4a" text-anchor="middle">
    Beispiel: [25, 3, 1] &#8594; Hidden-Aktivierungen a&#8321; &#8230; a&#8325; &#8594; z<tspan font-size="8.5" dy="2.5">out</tspan><tspan dy="-2.5"> = 0,68</tspan> &#8594; &#963;(0,68) = 0,66
  </text>
</svg>
