<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 398" width="100%" height="auto"
     role="img" aria-labelledby="sigTitle sigDesc">
  <title id="sigTitle">Sigmoid-Funktion: S-f&#246;rmige Kurve zwischen 0 und 1</title>
  <desc id="sigDesc">Der Graph der Sigmoid-Funktion sigma von z gleich 1 geteilt durch 1 plus e hoch minus z f&#252;r z von minus 6 bis plus 6. Die Kurve verl&#228;uft flach knapp &#252;ber 0, steigt zwischen z gleich minus 3 und plus 3 steil an, geht bei z gleich 0 durch den Wert 0,5 und flacht danach wieder knapp unter 1 ab. Die beiden flachen Randbereiche links von minus 3 und rechts von plus 3 sind orange hinterlegt und mit Ableitung ann&#228;hernd 0 beschriftet. Dort entsteht das Vanishing-Gradient-Problem.</desc>

  <defs>
    <marker id="sig-ax" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#757575" />
    </marker>
  </defs>

  <!-- S&#228;ttigungszonen: hier ist die Ableitung nahezu 0 -->
  <g fill="#fbe4d5" opacity="0.55">
    <rect x="70.0" y="78.0" width="98.0" height="258.0" rx="4" />
    <rect x="364.0" y="78.0" width="98.0" height="258.0" rx="4" />
  </g>
  <!-- Achsen -->
  <line x1="52.0" y1="299.7" x2="486.0" y2="299.7" stroke="#757575" stroke-width="2" marker-end="url(#sig-ax)" />
  <line x1="266.0" y1="344.0" x2="266.0" y2="62.0" stroke="#757575" stroke-width="2" marker-end="url(#sig-ax)" />
  <text x="496.0" y="304.7" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="middle">z</text>
  <text x="266.0" y="52.0" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="middle">&#963;(z)</text>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="middle">
    <line x1="70.0" y1="295.7" x2="70.0" y2="303.7" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="70.0" y="318.7">-6</text>
    <line x1="135.3" y1="295.7" x2="135.3" y2="303.7" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="135.3" y="318.7">-4</text>
