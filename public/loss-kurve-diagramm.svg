.83 453.88,292.04 456.44,292.25 459.00,292.45 461.56,292.64 464.12,292.84 466.69,293.02 469.25,293.21 471.81,293.39 474.38,293.56 476.94,293.74 479.50,293.91 482.06,294.07 484.62,294.23 487.19,294.39 489.75,294.55 492.31,294.70 494.88,294.85 497.44,294.99 500.00,295.13"
            fill="none" stroke="#00c6b2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ===================================================================
       START — zufaellige Gewichte, hoher Fehler
       =================================================================== -->
  <circle cx="90" cy="102.9" r="6" fill="#e07a3f" />
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="start"
     stroke="#ffffff" stroke-width="3.5" paint-order="stroke fill">
    <text x="106" y="92"  font-size="12" font-weight="700" fill="#e07a3f">Zuf&#228;llige Gewichte</text>
    <text x="106" y="108" font-size="11" fill="#4a4a4a">hoher Fehler</text>
  </g>

  <!-- ===================================================================
       ENDE — optimierte Gewichte, niedriger Fehler
       =================================================================== -->
  <circle cx="500" cy="295.1" r="6" fill="#00a294" />
  <line x1="452" y1="262" x2="493" y2="288" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3" />
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="middle">
    <text x="418" y="234" font-size="12" font-weight="700" fill="#00a294">Optimierte Gewichte</text>
    <text x="418" y="250" font-size="11" fill="#4a4a4a">niedriger Fehler</text>
  </g>

  <!-- ===================================================================
       BILDUNTERSCHRIFT
       =================================================================== -->
  <text x="280" y="384" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="600"
        fill="#4a4a4a" text-anchor="middle">Trainingsziel: Der Loss soll &#252;ber die Zeit sinken</text>
</svg>
