    <text x="28.0" y="121.3">2</text>
    <line x1="34.0" y1="223.6" x2="326.0" y2="223.6" stroke="#dcdcdc" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="28.0" y="227.6">0</text>
    <line x1="34.0" y1="330.0" x2="326.0" y2="330.0" stroke="#dcdcdc" stroke-width="1.5" stroke-dasharray="5 4" />
