<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="auto"
     role="img" aria-labelledby="neuronTitle neuronDesc">
  <title id="neuronTitle">Aufbau eines k&#252;nstlichen Neurons: gewichtete Summe und Aktivierung</title>
  <desc id="neuronDesc">Links stehen drei Eingaben des Versicherer-Cases: Fahreralter x1, Schadenshistorie x2 und
  Fahrzeugtyp x3. Jede Eingabe l&#228;uft &#252;ber einen Pfeil mit einem Gewicht w1, w2 beziehungsweise w3 in einen
  Summenknoten, in den zus&#228;tzlich der Bias b von unten einf&#228;llt. Der Summenknoten bildet die gewichtete Summe z.
  Das ist Schritt 1. In Schritt 2 flie&#223;t z in die Aktivierungsfunktion Sigma, die daraus die Ausgabe a gleich Sigma von z
  erzeugt.</desc>

  <defs>
    <!-- Pfeilspitze fuer die Signalwege -->
    <marker id="nrn-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#00c6b2" />
    </marker>
    <!-- Pfeilspitze fuer den Bias (dezenter, grau) -->
    <marker id="nrn-arrow-grey" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#757575" />
    </marker>
  </defs>

  <!-- ===================================================================
       SCHRITT-BEREICHE (gestrichelte Gruppierung, rein visuelle Klammer)
       =================================================================== -->
  <g fill="none" stroke="#e8e8e8" stroke-width="1.5" stroke-dasharray="6 5">
    <rect x="16" y="54" width="372" height="282" rx="8" />
    <rect x="404" y="54" width="336" height="282" rx="8" />
  </g>

  <g font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
     fill="#00a294" text-anchor="middle">
    <text x="202" y="40">Schritt 1 &#8212; Gewichtete Summe</text>
    <text x="572" y="40">Schritt 2 &#8212; Aktivierung</text>
  </g>

  <!-- ===================================================================
       EINGABEN (Versicherer-Case: drei Merkmale)
       =================================================================== -->
  <g>
    <!-- x1 -->
    <rect x="32" y="96" width="150" height="46" rx="4" fill="#e8e8e8" stroke="#00c6b2" stroke-width="2" />
    <text x="107" y="115" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="600"
          fill="#1e1e1e" text-anchor="middle">Fahreralter</text>
    <text x="107" y="132" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="700"
          fill="#00a294" text-anchor="middle">x&#8321;</text>

    <!-- x2 -->
    <rect x="32" y="170" width="150" height="46" rx="4" fill="#e8e8e8" stroke="#00c6b2" stroke-width="2" />
    <text x="107" y="189" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="600"
          fill="#1e1e1e" text-anchor="middle">Schadenshistorie</text>
    <text x="107" y="206" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="700"
          fill="#00a294" text-anchor="middle">x&#8322;</text>

    <!-- x3 -->
    <rect x="32" y="244" width="150" height="46" rx="4" fill="#e8e8e8" stroke="#00c6b2" stroke-width="2" />
    <text x="107" y="263" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="600"
          fill="#1e1e1e" text-anchor="middle">Fahrzeugtyp</text>
    <text x="107" y="280" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="700"
          fill="#00a294" text-anchor="middle">x&#8323;</text>
  </g>

  <!-- ===================================================================
       GEWICHTETE VERBINDUNGEN zum Summenknoten
       =================================================================== -->
  <g stroke="#00c6b2" stroke-width="2" stroke-linecap="round" marker-end="url(#nrn-arrow)">
    <line x1="186" y1="119" x2="265" y2="167" />
    <line x1="186" y1="193" x2="257" y2="193" />
    <line x1="186" y1="267" x2="265" y2="219" />
  </g>

  <g font-family="Montserrat, Helvetica, sans-serif" font-size="13" font-weight="700"
     fill="#00a294" text-anchor="middle">
    <text x="234" y="128">w&#8321;</text>
    <text x="222" y="184">w&#8322;</text>
    <text x="234" y="271">w&#8323;</text>
  </g>

  <!-- ===================================================================
       SUMMENKNOTEN
       =================================================================== -->
  <circle cx="310" cy="193" r="48" fill="#ffffff" stroke="#00c6b2" stroke-width="3" />
  <text x="310" y="204" font-family="Montserrat, Helvetica, sans-serif" font-size="34" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">&#931;</text>
  <!-- BIAS -->
  <rect x="266" y="296" width="88" height="34" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" />
  <text x="310" y="318" font-family="Montserrat, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">Bias b</text>
  <line x1="310" y1="294" x2="310" y2="246" stroke="#757575" stroke-width="2" stroke-linecap="round"
        marker-end="url(#nrn-arrow-grey)" />

  <!-- ===================================================================
       UEBERGANG z  ->  AKTIVIERUNGSFUNKTION
       =================================================================== -->
  <line x1="360" y1="193" x2="446" y2="193" stroke="#00c6b2" stroke-width="2.5" stroke-linecap="round"
        marker-end="url(#nrn-arrow)" />
  <text x="403" y="181" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
        fill="#00a294" text-anchor="middle">z</text>

  <circle cx="500" cy="193" r="48" fill="#bff1ec" stroke="#00c6b2" stroke-width="3" />
  <text x="500" y="205" font-family="Montserrat, Helvetica, sans-serif" font-size="30" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">&#963;</text>
  <text x="500" y="262" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="600"
        fill="#4a4a4a" text-anchor="middle">Aktivierungsfunktion</text>

  <!-- ===================================================================
       AUSGABE
       =================================================================== -->
  <line x1="552" y1="193" x2="618" y2="193" stroke="#00c6b2" stroke-width="2.5" stroke-linecap="round"
        marker-end="url(#nrn-arrow)" />
  <text x="585" y="181" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
        fill="#00a294" text-anchor="middle">a</text>

  <rect x="624" y="170" width="104" height="46" rx="4" fill="#00c6b2" stroke="#00c6b2" stroke-width="2" />
  <text x="676" y="198" font-family="Montserrat, Helvetica, sans-serif" font-size="15" font-weight="700"
        fill="#ffffff" text-anchor="middle">a = &#963;(z)</text>
  <text x="676" y="235" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="600"
        fill="#4a4a4a" text-anchor="middle">Ausgabe</text>
  <text x="676" y="251" font-family="Montserrat, Helvetica, sans-serif" font-size="12"
        fill="#4a4a4a" text-anchor="middle">des Neurons</text>

  <!-- ===================================================================
       FORMEL-BILDUNTERSCHRIFTEN
       =================================================================== -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
     fill="#1e1e1e" text-anchor="middle">
    <text x="202" y="366">z = w&#8321;x&#8321; + w&#8322;x&#8322; + w&#8323;x&#8323; + b</text>
    <text x="572" y="366">a = &#963;(z)</text>
  </g>
</svg>
