<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 398" width="100%" height="auto"
     role="img" aria-labelledby="reluTitle reluDesc">
  <title id="reluTitle">ReLU-Funktion: flach bei 0 f&#252;r negative z, linear f&#252;r positive z</title>
  <desc id="reluDesc">Der Graph der ReLU-Funktion, also Maximum von 0 und z, f&#252;r z von minus 6 bis plus 6. F&#252;r alle negativen z liegt die Kurve exakt auf der Nulllinie; dieser Bereich ist orange hinterlegt und mit Ableitung gleich 0 sowie Dead Neurons beschriftet. Ab z gleich 0 steigt die Linie geradlinig mit Steigung 1 an, die Ableitung ist dort konstant 1.</desc>

  <defs>
    <marker id="relu-ax" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#757575" />
    </marker>
  </defs>

  <!-- Zone der Dead Neurons: Ableitung exakt 0 -->
  <rect x="70.0" y="78.0" width="196.0" height="258.0" rx="4" fill="#fbe4d5" opacity="0.55" />
  <!-- Achsen -->
  <line x1="52.0" y1="297.1" x2="486.0" y2="297.1" stroke="#757575" stroke-width="2" marker-end="url(#relu-ax)" />
  <line x1="266.0" y1="344.0" x2="266.0" y2="62.0" stroke="#757575" stroke-width="2" marker-end="url(#relu-ax)" />
  <text x="496.0" y="302.1" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="middle">z</text>
  <text x="266.0" y="52.0" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1e1e1e" text-anchor="middle">ReLU(z)</text>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="middle">
    <line x1="70.0" y1="293.1" x2="70.0" y2="301.1" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="70.0" y="316.1">-6</text>
    <line x1="135.3" y1="293.1" x2="135.3" y2="301.1" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="135.3" y="316.1">-4</text>
    <line x1="200.7" y1="293.1" x2="200.7" y2="301.1" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="200.7" y="316.1">-2</text>
    <line x1="331.3" y1="293.1" x2="331.3" y2="301.1" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="331.3" y="316.1">2</text>
    <line x1="396.7" y1="293.1" x2="396.7" y2="301.1" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="396.7" y="316.1">4</text>
    <line x1="462.0" y1="293.1" x2="462.0" y2="301.1" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="462.0" y="316.1">6</text>
  </g>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="end">
    <line x1="58.0" y1="297.1" x2="472.0" y2="297.1" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="50.0" y="301.1">0</text>
    <line x1="58.0" y1="203.9" x2="472.0" y2="203.9" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="50.0" y="207.9">3</text>
    <line x1="58.0" y1="110.6" x2="472.0" y2="110.6" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="50.0" y="114.6">6</text>
  </g>
  <!-- ReLU-Kurve -->
  <polyline points="70.00,297.14 266.00,297.14 462.00,110.65" fill="none" stroke="#00c6b2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="266.0" cy="297.1" r="5" fill="#00a294" />
  <!-- Beschriftungen -->
  <text x="168.0" y="126.0" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#e07a3f" text-anchor="middle">Ableitung = 0</text>
  <text x="168.0" y="144.0" font-family="Montserrat, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#e07a3f" text-anchor="middle">&#8222;Dead Neurons&#8220; m&#246;glich</text>
  <text x="416.3" y="216.3" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#00a294" text-anchor="middle">Ableitung = 1</text>
  <text x="250" y="368" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#4a4a4a" text-anchor="middle">Negativ &#8594; 0, positiv &#8594; unver&#228;ndert durchreichen</text>
  <text x="250" y="386" font-family="Montserrat, Helvetica, sans-serif" font-size="11.5" fill="#757575" text-anchor="middle">Kein Vanishing Gradient im positiven Bereich</text>
</svg>
