<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 584 584" width="100%" height="auto"
     role="img" aria-labelledby="titleCrisp descCrisp">
  <title id="titleCrisp">CRISP-DM — der zyklische Prozess eines Data-Mining-Projekts</title>
  <desc id="descCrisp">Sechs Phasen sind ringfoermig um einen zentralen Datenbestand angeordnet und im Uhrzeigersinn
  durch gestrichelte graue Pfeile verbunden: Business Understanding oben, Data Understanding rechts oben,
  Data Preparation rechts unten, Modeling unten, Evaluation links unten und Deployment links oben.
  Zwei durchgezogene graue Pfeile heben die haeufigsten Rueckspruenge hervor: von Modeling zurueck zu Data Preparation
  sowie von Evaluation quer durch den Ring zurueck zu Business Understanding, womit der Zyklus neu beginnt.</desc>

  <defs>
    <!-- Pfeilspitzen (markerUnits = strokeWidth, skalieren also mit der Linienstaerke) -->
    <marker id="crisp-ah-dash" markerWidth="3.4" markerHeight="3.4" refX="2.7" refY="1.7" orient="auto">
      <polygon points="0 0, 3.4 1.7, 0 3.4" fill="#757575"/>
    </marker>
    <marker id="crisp-ah-solid" markerWidth="3.2" markerHeight="3.2" refX="2.5" refY="1.6" orient="auto">
      <polygon points="0 0, 3.2 1.6, 0 3.2" fill="#757575"/>
    </marker>
  </defs>

  <!-- ============================================================
       VERBINDUNGEN (zuerst gezeichnet, damit die Kreise darueber liegen)
       Ringradius 218 · Phasenkreisradius 72 · Ringmittelpunkt (310, 310)
       ============================================================ -->

  <!-- Gestrichelte Ringpfeile im Uhrzeigersinn: lose Abfolge benachbarter Phasen -->
  <g fill="none" stroke="#757575" stroke-width="4.5" stroke-dasharray="9 9"
     marker-end="url(#crisp-ah-dash)">
    <!-- Business Understanding -> Data Understanding -->
    <path d="M 386.3 105.8 A 218 218 0 0 1 448.7 141.8"/>
    <!-- Data Understanding -> Data Preparation -->
    <path d="M 525.0 274.0 A 218 218 0 0 1 525.0 346.0"/>
    <!-- Data Preparation -> Modeling -->
    <path d="M 448.7 478.2 A 218 218 0 0 1 386.3 514.2"/>
    <!-- Modeling -> Evaluation -->
    <path d="M 233.7 514.2 A 218 218 0 0 1 171.3 478.2"/>
    <!-- Evaluation -> Deployment -->
    <path d="M 95.0 346.0 A 218 218 0 0 1 95.0 274.0"/>
    <!-- Deployment -> Business Understanding -->
    <path d="M 171.3 141.8 A 218 218 0 0 1 233.7 105.8"/>
  </g>

  <!-- Durchgezogene Pfeile: die beiden dominanten Rueckspruenge -->
  <g fill="none" stroke="#757575" stroke-width="5.5" stroke-linecap="round"
     marker-end="url(#crisp-ah-solid)">
    <!-- (a) Modeling -> Data Preparation: haeufigste Iterationsschleife, aussen am Ring -->
    <path d="M 396.9 548.7 A 254 254 0 0 0 473.3 504.6"/>
    <!-- (b) Evaluation -> Business Understanding: quer durch den Ring, innen an Deployment vorbei -->
    <path d="M 194.1 356.8 A 125 125 0 0 1 292.6 186.2"/>
  </g>

  <!-- ============================================================
       ZENTRUM — Data
       Icon: Heroicons "server-stack" (outline, MIT)
       ============================================================ -->
  <circle cx="310" cy="310" r="86" fill="#bff1ec" stroke="#00C6B2" stroke-width="3.5"/>
  <g transform="translate(274.0,251.0) scale(3)" fill="none" stroke="#1a1a1a" stroke-width="0.9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.25 14.25h13.5m-13.5 0a3 3 0 0 1-3-3m3 3a3 3 0 1 0 0 6h13.5a3 3 0 1 0 0-6m-16.5-3a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3m-19.5 0a4.5 4.5 0 0 1 .9-2.7L5.737 5.1a3.375 3.375 0 0 1 2.7-1.35h7.126c1.062 0 2.062.5 2.7 1.35l2.587 3.45a4.5 4.5 0 0 1 .9 2.7m0 0a3 3 0 0 1-3 3m0 3h.008v.008h-.008v-.008Zm0-6h.008v.008h-.008v-.008Zm-3 6h.008v.008h-.008v-.008Zm0-6h.008v.008h-.008v-.008Z"/>
  </g>
  <text x="310" y="367" font-family="Montserrat, sans-serif" font-size="17" font-weight="600"
        fill="#1a1a1a" text-anchor="middle">Data</text>

  <!-- ============================================================
       PHASE 1 — BUSINESS UNDERSTANDING (12 Uhr, fachliche Phase)
       Icon: Heroicons "chat-bubble-left-right" (outline, MIT)
       ============================================================ -->
  <circle cx="310" cy="92" r="72" fill="#f5f5f5" stroke="#00C6B2" stroke-width="3.5"/>
  <g transform="translate(281.8,41.8) scale(2.35)" fill="none" stroke="#00C6B2" stroke-width="1.05"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155"/>
  </g>
  <g font-family="Montserrat, sans-serif" font-size="14.5" font-weight="500"
     fill="#1e1e1e" text-anchor="middle">
    <text x="310" y="112">Business</text>
    <text x="310" y="129">Understanding</text>
  </g>

  <!-- ============================================================
       PHASE 2 — DATA UNDERSTANDING (2 Uhr, datennahe Phase)
       Icon: Heroicons "circle-stack" (outline, MIT)
       ============================================================ -->
  <circle cx="498.8" cy="201" r="72" fill="#e9f8f6" stroke="#00C6B2" stroke-width="3.5"/>
  <g transform="translate(470.6,150.8) scale(2.35)" fill="none" stroke="#00C6B2" stroke-width="1.05"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125"/>
  </g>
  <g font-family="Montserrat, sans-serif" font-size="14.5" font-weight="500"
     fill="#1e1e1e" text-anchor="middle">
    <text x="498.8" y="221">Data</text>
    <text x="498.8" y="238">Understanding</text>
  </g>

  <!-- ============================================================
       PHASE 3 — DATA PREPARATION (4 Uhr, datennahe Phase)
       Icon: Heroicons "funnel" (outline, MIT)
       ============================================================ -->
  <circle cx="498.8" cy="419" r="72" fill="#e9f8f6" stroke="#00C6B2" stroke-width="3.5"/>
  <g transform="translate(470.6,368.8) scale(2.35)" fill="none" stroke="#00C6B2" stroke-width="1.05"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"/>
  </g>
  <g font-family="Montserrat, sans-serif" font-size="14.5" font-weight="500"
     fill="#1e1e1e" text-anchor="middle">
    <text x="498.8" y="439">Data</text>
    <text x="498.8" y="456">Preparation</text>
  </g>

  <!-- ============================================================
       PHASE 4 — MODELING (6 Uhr, datennahe Phase)
       Icon: Heroicons "cpu-chip" (outline, MIT)
       ============================================================ -->
  <circle cx="310" cy="528" r="72" fill="#e9f8f6" stroke="#00C6B2" stroke-width="3.5"/>
  <g transform="translate(281.8,477.8) scale(2.35)" fill="none" stroke="#00C6B2" stroke-width="1.05"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 0 0 2.25-2.25V6.75a2.25 2.25 0 0 0-2.25-2.25H6.75A2.25 2.25 0 0 0 4.5 6.75v10.5a2.25 2.25 0 0 0 2.25 2.25Zm.75-12h9v9h-9v-9Z"/>
  </g>
  <text x="310" y="562" font-family="Montserrat, sans-serif" font-size="14.5" font-weight="500"
        fill="#1e1e1e" text-anchor="middle">Modeling</text>

  <!-- ============================================================
       PHASE 5 — EVALUATION (8 Uhr, fachliche Phase)
       Icon: Heroicons "clipboard-document-check" (outline, MIT)
       ============================================================ -->
  <circle cx="121.2" cy="419" r="72" fill="#f5f5f5" stroke="#00C6B2" stroke-width="3.5"/>
  <g transform="translate(93.0,368.8) scale(2.35)" fill="none" stroke="#00C6B2" stroke-width="1.05"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m8.9-4.414c.376.023.75.05 1.124.08 1.131.094 1.976 1.057 1.976 2.192V16.5A2.25 2.25 0 0 1 18 18.75h-2.25m-7.5-10.5H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V18.75m-7.5-10.5h6.375c.621 0 1.125.504 1.125 1.125v9.375m-8.25-3 1.5 1.5 3-3.75"/>
  </g>
  <text x="121.2" y="453" font-family="Montserrat, sans-serif" font-size="14.5" font-weight="500"
        fill="#1e1e1e" text-anchor="middle">Evaluation</text>

  <!-- ============================================================
       PHASE 6 — DEPLOYMENT (10 Uhr, fachliche Phase)
       Icon: Heroicons "rocket-launch" (outline, MIT)
       ============================================================ -->
  <circle cx="121.2" cy="201" r="72" fill="#f5f5f5" stroke="#00C6B2" stroke-width="3.5"/>
  <g transform="translate(93.0,150.8) scale(2.35)" fill="none" stroke="#00C6B2" stroke-width="1.05"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"/>
  </g>
  <text x="121.2" y="235" font-family="Montserrat, sans-serif" font-size="14.5" font-weight="500"
        fill="#1e1e1e" text-anchor="middle">Deployment</text>
</svg>
