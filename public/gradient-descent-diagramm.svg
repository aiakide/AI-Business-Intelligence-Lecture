<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="100%" height="auto"
     role="img" aria-labelledby="gdTitle gdDesc">
  <title id="gdTitle">Gradient Descent: schrittweiser Abstieg in das Minimum der Loss-Landschaft</title>
  <desc id="gdDesc">Eine sch&#252;sself&#246;rmige Kurve zeigt den Loss L von w in Abh&#228;ngigkeit vom Gewicht w.
  Links oben auf dem Kurvenast liegt der Startpunkt mit einem zuf&#228;lligen Gewicht und hohem Loss. Von dort
  f&#252;hren vier Pfeile &#252;ber Zwischenpunkte bergab, wobei die Schritte zum Tal hin immer kleiner werden, bis der
  tiefste Punkt der Kurve erreicht ist: der minimale Loss. An einem der Zwischenpunkte ist die Tangente als
  orange Gerade eingezeichnet, sie stellt den Gradienten dar, also die Steigung an dieser Stelle. Der Gradient
  gibt die Richtung bergab an, die Lernrate alpha bestimmt die Schrittweite.</desc>

  <defs>
    <marker id="gd-ax" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#757575" />
    </marker>
    <marker id="gd-step" markerWidth="7" markerHeight="7" refX="5.6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#00776c" />
    </marker>
  </defs>

  <!-- ===================================================================
       ACHSEN
       =================================================================== -->
  <line x1="66" y1="330" x2="534" y2="330" stroke="#757575" stroke-width="2" marker-end="url(#gd-ax)" />
  <line x1="80" y1="352" x2="80"  y2="72"  stroke="#757575" stroke-width="2" marker-end="url(#gd-ax)" />
  <text x="80"  y="62"  font-family="Montserrat, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">L(w)</text>
  <text x="300" y="374" font-family="Montserrat, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">Gewicht w</text>

  <!-- ===================================================================
       LOSS-LANDSCHAFT (sch&#252;sself&#246;rmig)
       =================================================================== -->
  <polyline points="105.00,95.01 108.90,102.73 112.80,110.30 116.70,117.70 120.60,124.96 124.50,132.06 128.40,139.00 132.30,145.78 136.20,152.41 140.10,158.89 144.00,165.20 147.90,171.37 151.80,177.37 155.70,183.22 159.60,188.92 163.50,194.45 167.40,199.84 171.30,205.06 175.20,210.13 179.10,215.04 183.00,219.80 186.90,224.40 190.80,228.85 194.70,233.14 198.60,237.27 202.50,241.25 206.40,245.07 210.30,248.74 214.20,252.25 218.10,255.60 222.00,258.80 225.90,261.84 229.80,264.73 233.70,267.46 237.60,270.03 241.50,272.45 245.40,274.71 249.30,276.82 253.20,278.77 257.10,280.56 261.00,282.20 264.90,283.68 268.80,285.01 272.70,286.18 276.60,287.19 280.50,288.05 284.40,288.75 288.30,289.30 292.20,289.69 296.10,289.92 300.00,290.00 303.90,289.92 307.80,289.69 311.70,289.30 315.60,288.75 319.50,288.05 323.40,287.19 327.30,286.18 331.20,285.01 335.10,283.68 339.00,282.20 342.90,280.56 346.80,278.77 350.70,276.82 354.60,274.71 358.50,272.45 362.40,270.03 366.30,267.46 370.20,264.73 374.10,261.84 378.00,258.80 381.90,255.60 385.80,252.25 389.70,248.74 393.60,245.07 397.50,241.25 401.40,237.27 405.30,233.14 409.20,228.85 413.10,224.40 417.00,219.80 420.90,215.04 424.80,210.13 428.70,205.06 432.60,199.84 436.50,194.45 440.40,188.92 444.30,183.22 448.20,177.37 452.10,171.37 456.00,165.20 459.90,158.89 463.80,152.41 467.70,145.78 471.60,139.00 475.50,132.06 479.40,124.96 483.30,117.70 487.20,110.30 491.10,102.73 495.00,95.01"
            fill="none" stroke="#00c6b2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- ===================================================================
       GRADIENT / TANGENTE am zweiten Schritt
       =================================================================== -->
  <line x1="120" y1="135.7" x2="216" y2="265.6" stroke="#e07a3f" stroke-width="2.5" stroke-linecap="round" />
  <line x1="222" y1="176" x2="187" y2="196" stroke="#e07a3f" stroke-width="1.5" stroke-dasharray="4 3" />
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="start">
    <text x="228" y="166" font-size="12" font-weight="700" fill="#e07a3f">Gradient = Steigung hier</text>
    <text x="228" y="182" font-size="11" fill="#4a4a4a">zeigt, wo es bergab geht</text>
  </g>

  <!-- ===================================================================
       ABSTIEGS-SCHRITTE (Pfeile bergab, werden zum Tal hin kleiner)
       =================================================================== -->
  <g stroke="#00776c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#gd-step)">
    <line x1="133.9" y1="147.5" x2="161.0" y2="189.7" />
    <line x1="175.3" y1="208.9" x2="203.4" y2="240.6" />
    <line x1="221.0" y1="256.6" x2="241.3" y2="271.8" />
    <line x1="262.7" y1="280.8" x2="287.4" y2="287.0" />
  </g>

  <!-- ===================================================================
       PUNKTE AUF DER KURVE
       =================================================================== -->
  <circle cx="128" cy="138.3" r="7" fill="#e07a3f" stroke="#ffffff" stroke-width="2" />
  <g fill="#00a294" stroke="#ffffff" stroke-width="2">
    <circle cx="168" cy="200.6" r="7" />
    <circle cx="212" cy="250.3" r="7" />
    <circle cx="252" cy="278.2" r="7" />
  </g>
  <circle cx="300" cy="290" r="8" fill="#00c6b2" stroke="#1e1e1e" stroke-width="2" />

  <!-- Start-Beschriftung -->
  <line x1="150" y1="124" x2="134" y2="133" stroke="#e07a3f" stroke-width="1.5" stroke-dasharray="4 3" />
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="start">
    <text x="156" y="114" font-size="12" font-weight="700" fill="#e07a3f">Start</text>
    <text x="156" y="129" font-size="10.5" fill="#4a4a4a">zuf&#228;lliges w</text>
  </g>

  <!-- Minimum-Beschriftung -->
  <line x1="300" y1="298" x2="300" y2="326" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="300" y="344" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">Minimaler Loss</text>

  <!-- ===================================================================
       BILDUNTERSCHRIFT
       =================================================================== -->
  <text x="290" y="394" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="600"
        fill="#4a4a4a" text-anchor="middle">w := w &#8722; &#945; &#183; &#8706;L/&#8706;w &#8212; Schritt f&#252;r Schritt bergab ins Tal</text>
</svg>
