<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="100%" height="auto"
     role="img" aria-labelledby="bpTitle bpDesc">
  <title id="bpTitle">Der Trainingszyklus: Forward Pass, Loss, Backward Pass und Gewichtsupdate</title>
  <desc id="bpDesc">Vier Stationen sind ringf&#246;rmig um einen Mittelpunkt angeordnet und im Uhrzeigersinn durch
  gestrichelte Pfeile verbunden. Oben Schritt 1, der Forward Pass, bei dem das Netz eine Vorhersage berechnet.
  Rechts Schritt 2, die Loss-Berechnung, bei der Vorhersage und echtes Label verglichen werden. Unten Schritt 3,
  der Backward Pass, bei dem der Fehler r&#252;ckw&#228;rts durch die Schichten flie&#223;t und f&#252;r jedes Gewicht ein Gradient
  berechnet wird. Links Schritt 4, das Gewichtsupdate per Gradient Descent. Von dort f&#252;hrt der Pfeil zur&#252;ck zu
  Schritt 1: die n&#228;chste Iteration beginnt. Im Zentrum steht, dass sich dieser Trainingsschritt tausendfach wiederholt.</desc>

  <defs>
    <marker id="bp-arrow" markerWidth="3.4" markerHeight="3.4" refX="2.7" refY="1.7" orient="auto">
      <polygon points="0 0, 3.4 1.7, 0 3.4" fill="#00c6b2" />
    </marker>
  </defs>

  <!-- ===================================================================
       RING-PFEILE IM UHRZEIGERSINN (zuerst gezeichnet)
       Ringradius 175 · Stationsradius 72 · Ringmittelpunkt (350, 290)
       =================================================================== -->
  <g fill="none" stroke="#00c6b2" stroke-width="4" stroke-dasharray="8 8"
     marker-end="url(#bp-arrow)">
    <!-- 1 Forward Pass -> 2 Loss -->
    <path d="M 429.5 134.1 A 175 175 0 0 1 505.9 210.6" />
    <!-- 2 Loss -> 3 Backward Pass -->
    <path d="M 505.9 369.4 A 175 175 0 0 1 429.5 445.9" />
    <!-- 3 Backward Pass -> 4 Gewichtsupdate -->
    <path d="M 270.5 445.9 A 175 175 0 0 1 194.1 369.4" />
    <!-- 4 Gewichtsupdate -> 1 Forward Pass (naechste Iteration) -->
    <path d="M 194.1 210.6 A 175 175 0 0 1 270.5 134.1" />
  </g>

  <text x="196" y="140" font-family="Montserrat, Helvetica, sans-serif" font-size="12" font-weight="700"
        fill="#00a294" text-anchor="middle">n&#228;chste Iteration</text>

  <!-- ===================================================================
       ZENTRUM
       =================================================================== -->
  <circle cx="350" cy="290" r="76" fill="#bff1ec" stroke="#00c6b2" stroke-width="3.5" />
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="middle">
    <text x="350" y="278" font-size="12.5" font-weight="700" fill="#1e1e1e">Ein Trainingsschritt</text>
    <text x="350" y="300" font-size="11.5" fill="#1e1e1e">wiederholt sich</text>
    <text x="350" y="316" font-size="11.5" fill="#1e1e1e">tausendfach</text>
  </g>

  <!-- ===================================================================
       STATION 1 — FORWARD PASS (12 Uhr)
       =================================================================== -->
  <circle cx="350" cy="115" r="72" fill="#ffffff" stroke="#00c6b2" stroke-width="3.5" />
  <circle cx="350" cy="71" r="15" fill="#00c6b2" />
  <text x="350" y="76" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
        fill="#ffffff" text-anchor="middle">1</text>
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="middle">
    <text x="350" y="113" font-size="13.5" font-weight="700" fill="#1e1e1e">Forward Pass</text>
    <text x="350" y="132" font-size="11" fill="#4a4a4a">Vorhersage berechnen</text>
    <text x="350" y="148" font-size="11" font-weight="700" fill="#00a294">&#375; = netz(x)</text>
  </g>

  <!-- ===================================================================
       STATION 2 — LOSS (3 Uhr)
       =================================================================== -->
  <circle cx="525" cy="290" r="72" fill="#f5f5f5" stroke="#00c6b2" stroke-width="3.5" />
  <circle cx="525" cy="246" r="15" fill="#00c6b2" />
  <text x="525" y="251" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
        fill="#ffffff" text-anchor="middle">2</text>
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="middle">
    <text x="525" y="288" font-size="13.5" font-weight="700" fill="#1e1e1e">Loss berechnen</text>
    <text x="525" y="307" font-size="11" fill="#4a4a4a">Vorhersage vs. Label</text>
    <text x="525" y="323" font-size="11" font-weight="700" fill="#00a294">L = loss(&#375;, y)</text>
  </g>

  <!-- ===================================================================
       STATION 3 — BACKWARD PASS (6 Uhr, hervorgehoben)
       =================================================================== -->
  <circle cx="350" cy="465" r="72" fill="#bff1ec" stroke="#00c6b2" stroke-width="3.5" />
  <circle cx="350" cy="421" r="15" fill="#00c6b2" />
  <text x="350" y="426" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
        fill="#ffffff" text-anchor="middle">3</text>
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="middle">
    <text x="350" y="463" font-size="13.5" font-weight="700" fill="#1e1e1e">Backward Pass</text>
    <text x="350" y="482" font-size="11" fill="#4a4a4a">Fehler flie&#223;t r&#252;ckw&#228;rts</text>
    <text x="350" y="498" font-size="11" font-weight="700" fill="#00a294">Gradient &#8706;L / &#8706;w</text>
  </g>

  <!-- ===================================================================
       STATION 4 — GEWICHTSUPDATE (9 Uhr)
       =================================================================== -->
  <circle cx="175" cy="290" r="72" fill="#f5f5f5" stroke="#00c6b2" stroke-width="3.5" />
  <circle cx="175" cy="246" r="15" fill="#00c6b2" />
  <text x="175" y="251" font-family="Montserrat, Helvetica, sans-serif" font-size="14" font-weight="700"
        fill="#ffffff" text-anchor="middle">4</text>
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="middle">
    <text x="175" y="288" font-size="13.5" font-weight="700" fill="#1e1e1e">Gewichtsupdate</text>
    <text x="175" y="307" font-size="11" fill="#4a4a4a">Gradient Descent</text>
    <text x="175" y="323" font-size="11" font-weight="700" fill="#00a294">w := w &#8722; &#945; &#183; &#8706;L/&#8706;w</text>
  </g>

  <!-- ===================================================================
       BILDUNTERSCHRIFT — Versicherer-Case
       =================================================================== -->
  <line x1="120" y1="556" x2="580" y2="556" stroke="#e8e8e8" stroke-width="1" />
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" fill="#4a4a4a">
    <text x="350" y="578">
      <tspan font-weight="700" fill="#1e1e1e">Versicherer-Case:</tspan>
      Das Netz sagt 66 % Betrug &#8212; der echte Fall war Betrug.
    </text>
    <text x="350" y="596">Der Loss misst diese L&#252;cke, die Gradienten zeigen die Korrekturrichtung.</text>
  </g>
</svg>
