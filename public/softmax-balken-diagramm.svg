  <rect x="45.3" y="112.0" width="18.0" height="111.7" rx="2" fill="#8f8f8f" />
  <text x="54.3" y="106.0" font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="600" fill="#4a4a4a" text-anchor="middle">2,1</text>
  <rect x="73.9" y="207.7" width="18.0" height="16.0" rx="2" fill="#c4c4c4" />
