<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="100%" height="auto" role="img" aria-label="Streudiagramm: Fahrzeugalter in Jahren gegen Reparaturkosten in Euro, vier Punkte auf nahezu gerader Linie">
  <title>Streudiagramm Fahrzeugalter vs. Reparaturkosten</title>

  <!-- Transparente Flaeche: keine Hintergrundfarbe, damit die SVG auf dem Folienhintergrund sitzt -->

  <!-- Gridlines (horizontal, dezent) -->
  <g stroke="#e8e8e8" stroke-width="1">
    <line x1="90" y1="225.71" x2="510" y2="225.71" />
    <line x1="90" y1="151.43" x2="510" y2="151.43" />
    <line x1="90" y1="77.14"  x2="510" y2="77.14" />
  </g>

  <!-- Achsen -->
  <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="square">
    <line x1="90" y1="40"  x2="90"  y2="300" />
    <line x1="90" y1="300" x2="510" y2="300" />
  </g>

  <!-- Y-Achsen-Ticks und Beschriftung -->
  <g font-family="Montserrat, sans-serif" font-size="12" fill="#1a1a1a">
    <g stroke="#1a1a1a" stroke-width="2">
      <line x1="84" y1="300"    x2="90" y2="300" />
      <line x1="84" y1="225.71" x2="90" y2="225.71" />
      <line x1="84" y1="151.43" x2="90" y2="151.43" />
      <line x1="84" y1="77.14"  x2="90" y2="77.14" />
    </g>
    <text x="76" y="304"    text-anchor="end">0</text>
    <text x="76" y="229.71" text-anchor="end">200</text>
    <text x="76" y="155.43" text-anchor="end">400</text>
    <text x="76" y="81.14"  text-anchor="end">600</text>
  </g>

  <!-- X-Achsen-Ticks und Beschriftung -->
  <g font-family="Montserrat, sans-serif" font-size="12" fill="#1a1a1a">
    <g stroke="#1a1a1a" stroke-width="2">
      <line x1="174" y1="300" x2="174" y2="306" />
      <line x1="258" y1="300" x2="258" y2="306" />
      <line x1="342" y1="300" x2="342" y2="306" />
      <line x1="426" y1="300" x2="426" y2="306" />
    </g>
    <text x="174" y="322" text-anchor="middle">1</text>
    <text x="258" y="322" text-anchor="middle">2</text>
    <text x="342" y="322" text-anchor="middle">3</text>
    <text x="426" y="322" text-anchor="middle">4</text>
  </g>

  <!-- Datenpunkte: (1,200) (2,300) (3,500) (4,600) -->
  <g fill="#00C6B2">
    <circle cx="174" cy="225.71" r="8" />
    <circle cx="258" cy="188.57" r="8" />
    <circle cx="342" cy="114.29" r="8" />
    <circle cx="426" cy="77.14"  r="8" />
  </g>

  <!-- Achsentitel -->
  <g font-family="Montserrat, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">
    <text x="300" y="348" text-anchor="middle">Fahrzeugalter (Jahre)</text>
    <text x="26" y="170" text-anchor="middle" transform="rotate(-90 26 170)">Reparaturkosten (EUR)</text>
  </g>
</svg>
