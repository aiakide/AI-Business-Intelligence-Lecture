<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 336" width="100%" height="auto" role="img"
     aria-label="Liniendiagramm der Elbow-Methode fuer die K-Means-Segmentierung von 5.000 Versicherungskunden. Auf der x-Achse steht die Anzahl der Cluster K von 1 bis 8, auf der y-Achse die WCSS von 0 bis 550.000. Die Werte lauten: K gleich 1 rund 520.000, K gleich 2 rund 310.000, K gleich 3 rund 210.000, K gleich 4 rund 165.000, K gleich 5 rund 142.000, K gleich 6 rund 128.000, K gleich 7 rund 118.000, K gleich 8 rund 112.000. Von K gleich 1 bis K gleich 3 faellt die Kurve steil, danach verlaeuft sie deutlich flacher. Eine gestrichelte senkrechte Linie markiert den Knick bei K gleich 3. Rechts erklaert eine Legende, dass der steile Bereich hohen Grenznutzen bedeutet, der flache Bereich nur noch geringen Zugewinn und der Knick die beste Balance bei K gleich 3 darstellt.">
  <title>Elbow-Methode: WCSS-Verlauf für K = 1 bis 8 mit Knick bei K = 3</title>

  <defs>
    <!-- Pfeilspitzen fuer die Achsen -->
    <marker id="elbow-axis-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#1e1e1e" />
    </marker>
  </defs>

  <!-- ===================== Panel-Trenner ===================== -->
  <line x1="812" y1="8" x2="812" y2="324" stroke="#e8e8e8" stroke-width="1" />

  <!-- ===================================================================
       PANEL 1 - Elbow-Kurve
       Massstab:  x = 160 + (K - 1) * 85
                  y = 270 - WCSS * 225 / 550000
       =================================================================== -->

  <!-- Hintergrundschattierung: zwei Bereiche mit unterschiedlichem Grenznutzen -->
  <rect x="120" y="42" width="210" height="228" fill="#00c6b2" opacity="0.09" />
  <rect x="330" y="42" width="465" height="228" fill="#f5f5f5" />

  <!-- waagerechte Hilfslinien -->
  <g stroke="#e8e8e8" stroke-width="1" stroke-dasharray="3 4">
    <line x1="120" y1="65.5"  x2="795" y2="65.5" />
    <line x1="120" y1="106.4" x2="795" y2="106.4" />
    <line x1="120" y1="147.3" x2="795" y2="147.3" />
    <line x1="120" y1="188.2" x2="795" y2="188.2" />
    <line x1="120" y1="229.1" x2="795" y2="229.1" />
  </g>

  <!-- Achsen -->
  <line x1="120" y1="270" x2="800" y2="270" stroke="#1e1e1e" stroke-width="1.6" marker-end="url(#elbow-axis-arrow)" />
  <line x1="120" y1="270" x2="120" y2="38"  stroke="#1e1e1e" stroke-width="1.6" marker-end="url(#elbow-axis-arrow)" />

  <!-- y-Achsenbeschriftung (Werte) -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="end">
    <text x="112" y="274">0</text>
    <text x="112" y="233">100.000</text>
    <text x="112" y="192">200.000</text>
    <text x="112" y="151">300.000</text>
    <text x="112" y="110">400.000</text>
    <text x="112" y="69">500.000</text>
  </g>

  <!-- Achsentitel -->
  <text x="42" y="155" font-family="Montserrat, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#1e1e1e" text-anchor="middle" transform="rotate(-90 42 155)">WCSS</text>
  <text x="457" y="318" font-family="Montserrat, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">Anzahl Cluster (K)</text>

  <!-- x-Achsenbeschriftung (K-Werte) -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="12" fill="#4a4a4a" text-anchor="middle">
    <text x="160" y="290">1</text>
    <text x="245" y="290">2</text>
    <text x="330" y="290" font-weight="700" fill="#1e1e1e">3</text>
    <text x="415" y="290">4</text>
    <text x="500" y="290">5</text>
    <text x="585" y="290">6</text>
    <text x="670" y="290">7</text>
    <text x="755" y="290">8</text>
  </g>

  <!-- Bereichsbeschriftungen -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">
    <text x="225" y="260" fill="#00a494">Grenznutzen hoch</text>
    <text x="562" y="260" fill="#8a8a8a">Grenznutzen niedrig</text>
  </g>

  <!-- Kurve: steiler Abschnitt K = 1 bis 3 (dick, volle Sättigung) -->
  <polyline points="160,57.3 245,143.2 330,184.1"
            fill="none" stroke="#00c6b2" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Kurve: flacher Abschnitt K = 3 bis 8 (duenner, zurueckgenommen) -->
  <polyline points="330,184.1 415,202.5 500,211.9 585,217.6 670,221.7 755,224.2"
            fill="none" stroke="#00c6b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />

  <!-- Markierung des Knicks bei K = 3 -->
  <line x1="330" y1="42" x2="330" y2="270" stroke="#e8734a" stroke-width="1.6" stroke-dasharray="5 4" />
  <line x1="356" y1="122" x2="337" y2="177" stroke="#e8734a" stroke-width="1.4" opacity="0.7" />

  <!-- Datenpunkte -->
  <g fill="#ffffff" stroke="#00c6b2" stroke-width="2.4">
    <circle cx="160" cy="57.3"  r="5" />
    <circle cx="245" cy="143.2" r="5" />
    <circle cx="415" cy="202.5" r="5" />
    <circle cx="500" cy="211.9" r="5" />
    <circle cx="585" cy="217.6" r="5" />
    <circle cx="670" cy="221.7" r="5" />
    <circle cx="755" cy="224.2" r="5" />
  </g>
  <!-- Elbow-Punkt hervorgehoben -->
  <circle cx="330" cy="184.1" r="7.5" fill="#00c6b2" stroke="#ffffff" stroke-width="2.6" />

  <!-- Werte zur Orientierung (nur K = 1, 3, 8) -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#4a4a4a">
    <text x="172" y="52"  text-anchor="start">520.000</text>
    <text x="322" y="207" text-anchor="end">210.000</text>
    <text x="755" y="213" text-anchor="middle">112.000</text>
  </g>

  <!-- Annotation zum Knick -->
  <g font-family="Montserrat, Helvetica, sans-serif" text-anchor="start">
    <text x="352" y="98"  font-size="14" font-weight="700" fill="#e8734a">Elbow bei K = 3</text>
    <text x="352" y="116" font-size="12" font-weight="500" fill="#4a4a4a">hier knickt die Kurve ab</text>
  </g>

  <!-- ===================================================================
       PANEL 2 - Lesehilfe
       =================================================================== -->
  <g font-family="Montserrat, Helvetica, sans-serif">
    <text x="832" y="30" font-size="14" font-weight="700" fill="#1e1e1e">So liest du die Kurve</text>

    <!-- 1) steiler Abschnitt -->
    <line x1="832" y1="59" x2="850" y2="59" stroke="#00c6b2" stroke-width="3.6" stroke-linecap="round" />
    <text x="860" y="63"  font-size="12.5" font-weight="700" fill="#1e1e1e">K = 1 → 3: steiler Abfall</text>
    <text x="860" y="81"  font-size="12" font-weight="500" fill="#4a4a4a">Jeder zusätzliche Cluster senkt</text>
    <text x="860" y="97"  font-size="12" font-weight="500" fill="#4a4a4a">die WCSS deutlich.</text>

    <!-- 2) flacher Abschnitt -->
    <line x1="832" y1="121" x2="850" y2="121" stroke="#00c6b2" stroke-width="2" stroke-linecap="round" opacity="0.55" />
    <text x="860" y="125" font-size="12.5" font-weight="700" fill="#1e1e1e">Ab K = 4: flacher Verlauf</text>
    <text x="860" y="143" font-size="12" font-weight="500" fill="#4a4a4a">Kaum noch Gewinn — mehr</text>
    <text x="860" y="159" font-size="12" font-weight="500" fill="#4a4a4a">Cluster bringen wenig.</text>

    <!-- 3) der Knick -->
    <line x1="832" y1="183" x2="850" y2="183" stroke="#e8734a" stroke-width="2" stroke-dasharray="4 3" />
    <text x="860" y="187" font-size="12.5" font-weight="700" fill="#e8734a">Der Knick = Elbow</text>
    <text x="860" y="205" font-size="12" font-weight="500" fill="#4a4a4a">Beste Balance aus kompakten</text>
    <text x="860" y="221" font-size="12" font-weight="500" fill="#4a4a4a">Clustern und Einfachheit.</text>

    <!-- Fazit -->
    <rect x="832" y="241" width="228" height="66" rx="4" fill="#00c6b2" opacity="0.09" />
    <rect x="832" y="241" width="4" height="66" rx="2" fill="#00c6b2" />
    <text x="848" y="263" font-size="12.5" font-weight="700" fill="#1e1e1e">Entscheidung: K = 3</text>
    <text x="848" y="281" font-size="12" font-weight="500" fill="#4a4a4a">Drei Risikogruppen für die</text>
    <text x="848" y="297" font-size="12" font-weight="500" fill="#4a4a4a">5.000 Kunden.</text>
  </g>
</svg>
