<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="auto"
     role="img" aria-labelledby="titleCMB descCMB">
  <title id="titleCMB">Confusion Matrix im Beispiel: 1.000 Testfaelle</title>
  <desc id="descCMB">2x2-Matrix mit konkreten Zahlen: True Positive 15, False Negative 5, False Positive 30, True Negative 950. Zeilensummen 20 tatsaechliche Betrugsfaelle und 980 tatsaechlich legitime Faelle, Gesamtsumme 1.000.</desc>

  <style>
    .t     { font-family: Montserrat, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .hdr   { font-size: 15px; font-weight: 700; fill: #1e1e1e; }
    .axlbl { font-size: 14px; font-weight: 700; fill: #1e1e1e; }
    .num   { font-size: 38px; font-weight: 800; }
    .code  { font-size: 13px; font-weight: 700; }
    .sum   { font-size: 16px; font-weight: 700; fill: #1e1e1e; }
    .sumlbl{ font-size: 11.5px; fill: #757575; }
  </style>

  <!-- ============ Achsenbeschriftungen ============ -->
  <text class="t axlbl" x="380" y="26" text-anchor="middle">Modell sagt vorher</text>
  <text class="t axlbl" x="26" y="240" text-anchor="middle" transform="rotate(-90 26 240)">Tatsaechlich ist</text>

  <!-- Spaltenkoepfe -->
  <rect x="205" y="42" width="255" height="34" rx="6" fill="#f5f5f5" />
  <text class="t hdr" x="332" y="64" text-anchor="middle">Betrug</text>

  <rect x="470" y="42" width="255" height="34" rx="6" fill="#f5f5f5" />
  <text class="t hdr" x="597" y="64" text-anchor="middle">Kein Betrug</text>

  <!-- Zeilenkoepfe -->
  <rect x="45" y="84" width="150" height="145" rx="6" fill="#f5f5f5" />
  <text class="t hdr" x="120" y="151" text-anchor="middle">Betrug</text>
  <text class="t sumlbl" x="120" y="168" text-anchor="middle">(20 Fälle)</text>

  <rect x="45" y="239" width="150" height="145" rx="6" fill="#f5f5f5" />
  <text class="t hdr" x="120" y="306" text-anchor="middle">Kein Betrug</text>
  <text class="t sumlbl" x="120" y="323" text-anchor="middle">(980 Fälle)</text>

  <!-- ============ Zellen ============ -->
  <!-- TP = 15 -->
  <rect x="205" y="84" width="255" height="145" rx="8" fill="#e2f7f4" stroke="#00c6b2" stroke-width="2" />
  <text class="t num" x="332" y="150" text-anchor="middle" fill="#1f9d55">15</text>
  <text class="t code" x="332" y="172" text-anchor="middle" fill="#1f9d55">TP — richtig erkannt</text>

  <!-- FN = 5 -->
  <rect x="470" y="84" width="255" height="145" rx="8" fill="#fdeaea" stroke="#ef4444" stroke-width="2" />
  <text class="t num" x="597" y="150" text-anchor="middle" fill="#ef4444">5</text>
  <text class="t code" x="597" y="172" text-anchor="middle" fill="#ef4444">FN — übersehen</text>

  <!-- FP = 30 -->
  <rect x="205" y="239" width="255" height="145" rx="8" fill="#fdeaea" stroke="#ef4444" stroke-width="2" />
  <text class="t num" x="332" y="305" text-anchor="middle" fill="#ef4444">30</text>
  <text class="t code" x="332" y="327" text-anchor="middle" fill="#ef4444">FP — Falschalarm</text>

  <!-- TN = 950 -->
  <rect x="470" y="239" width="255" height="145" rx="8" fill="#e2f7f4" stroke="#00c6b2" stroke-width="2" />
  <text class="t num" x="597" y="305" text-anchor="middle" fill="#1f9d55">950</text>
  <text class="t code" x="597" y="327" text-anchor="middle" fill="#1f9d55">TN — richtig erkannt</text>

  <!-- ============ Gesamtsumme ============ -->
  <g transform="translate(0,0)">
    <line x1="45" y1="400" x2="725" y2="400" stroke="#e0e0e0" stroke-width="1.5" />
    <text class="t sum" x="385" y="428" text-anchor="middle">15 + 5 + 30 + 950 = 1.000 ✓ Konsistenzcheck bestanden</text>
  </g>
</svg>
