<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 478" width="100%" height="auto"
     role="img" aria-labelledby="titleGB descGB">
  <title id="titleGB">Gradient Boosting — sequenzielle Fehlerkorrektur</title>
  <desc id="descGB">Drei Modell-Boxen stehen nebeneinander und sind durch Pfeile von links nach rechts verbunden.
  Baum 1 startet mit einer Fehlerrate von 25 Prozent (rot), der Pfeil zu Baum 2 ist mit "korrigiert 15% der Fehler"
  beschriftet. Baum 2 weist einen Restfehler von 10 Prozent auf (gelb), der Pfeil zu Baum 3 ist mit
  "korrigiert weitere 8%" beschriftet. Baum 3 verbleibt bei einem Restfehler von 2 Prozent (gruen).
  Alle drei Baeume fuehren nach unten in eine gemeinsame, tuerkis hervorgehobene Ergebnis-Box:
  Finale Ensemble-Vorhersage mit einem Gesamtfehler von 2 Prozent.</desc>

  <defs>
    <!-- Pfeilspitzen: jeweils in der Farbe der Zielstufe -->
    <marker id="gb-ah-yellow" markerWidth="3.4" markerHeight="3.4" refX="2.7" refY="1.7" orient="auto">
      <polygon points="0 0, 3.4 1.7, 0 3.4" fill="#e6a70a"/>
    </marker>
    <marker id="gb-ah-green" markerWidth="3.4" markerHeight="3.4" refX="2.7" refY="1.7" orient="auto">
      <polygon points="0 0, 3.4 1.7, 0 3.4" fill="#2e9e4f"/>
    </marker>
    <marker id="gb-ah-teal" markerWidth="3.4" markerHeight="3.4" refX="2.7" refY="1.7" orient="auto">
      <polygon points="0 0, 3.4 1.7, 0 3.4" fill="#00c6b2"/>
    </marker>

    <!-- Farbverlaeufe der Uebergangspfeile: Rot -> Gelb -> Gruen -->
    <!-- gradientUnits = userSpaceOnUse, da waagerechte Linien eine Bounding-Box-Hoehe von 0 haben -->
    <linearGradient id="gb-grad-1" gradientUnits="userSpaceOnUse" x1="274" y1="160" x2="352" y2="160">
      <stop offset="0%" stop-color="#d94f3d"/>
      <stop offset="100%" stop-color="#e6a70a"/>
    </linearGradient>
    <linearGradient id="gb-grad-2" gradientUnits="userSpaceOnUse" x1="544" y1="160" x2="622" y2="160">
      <stop offset="0%" stop-color="#e6a70a"/>
      <stop offset="100%" stop-color="#2e9e4f"/>
    </linearGradient>
  </defs>

  <!-- ============================================================
       UEBERSCHRIFT
       ============================================================ -->
  <text x="450" y="36" font-family="Montserrat, Helvetica, sans-serif" font-size="20" font-weight="600"
        fill="#1e1e1e" text-anchor="middle">Jeder Baum lernt aus den Fehlern des Vorgängers</text>

  <!-- ============================================================
       STUFE 1 — BAUM 1 (hoher Fehler, rot)
       Box: x 90..270 · y 80..230 · Mitte x = 180
       ============================================================ -->
  <rect x="90" y="80" width="180" height="150" rx="6" fill="#fdeceb" stroke="#d94f3d" stroke-width="3"/>
  <text x="180" y="119" font-family="Montserrat, Helvetica, sans-serif" font-size="19" font-weight="600"
        fill="#1e1e1e" text-anchor="middle">Baum 1</text>
  <!-- Fehlerbalken: Skala 140 px entspricht 25 % -->
  <rect x="110" y="141" width="140" height="14" rx="7" fill="#ffffff" stroke="#e8e8e8" stroke-width="1.5"/>
  <rect x="110" y="141" width="140" height="14" rx="7" fill="#d94f3d"/>
  <text x="180" y="192" font-family="Montserrat, Helvetica, sans-serif" font-size="15" font-weight="600"
        fill="#d94f3d" text-anchor="middle">Fehlerrate: 25 %</text>
  <text x="180" y="213" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5"
        fill="#757575" text-anchor="middle">erster grober Schätzer</text>

  <!-- Uebergang 1 -> 2 -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="500"
     fill="#757575" text-anchor="middle">
    <text x="315" y="128">korrigiert 15 %</text>
    <text x="315" y="144">der Fehler</text>
  </g>
  <line x1="274" y1="160" x2="352" y2="160" stroke="url(#gb-grad-1)" stroke-width="4"
        stroke-linecap="round" marker-end="url(#gb-ah-yellow)"/>

  <!-- ============================================================
       STUFE 2 — BAUM 2 (mittlerer Fehler, gelb)
       Box: x 360..540 · y 80..230 · Mitte x = 450
       ============================================================ -->
  <rect x="360" y="80" width="180" height="150" rx="6" fill="#fdf4e0" stroke="#e6a70a" stroke-width="3"/>
  <text x="450" y="119" font-family="Montserrat, Helvetica, sans-serif" font-size="19" font-weight="600"
        fill="#1e1e1e" text-anchor="middle">Baum 2</text>
  <!-- Restfehler 10 % = 56 px -->
  <rect x="380" y="141" width="140" height="14" rx="7" fill="#ffffff" stroke="#e8e8e8" stroke-width="1.5"/>
  <rect x="380" y="141" width="56" height="14" rx="7" fill="#e6a70a"/>
  <text x="450" y="192" font-family="Montserrat, Helvetica, sans-serif" font-size="15" font-weight="600"
        fill="#b8850a" text-anchor="middle">Restfehler: 10 %</text>
  <text x="450" y="213" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5"
        fill="#757575" text-anchor="middle">trainiert auf Residuen</text>

  <!-- Uebergang 2 -> 3 -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="500"
     fill="#757575" text-anchor="middle">
    <text x="585" y="128">korrigiert</text>
    <text x="585" y="144">weitere 8 %</text>
  </g>
  <line x1="544" y1="160" x2="622" y2="160" stroke="url(#gb-grad-2)" stroke-width="4"
        stroke-linecap="round" marker-end="url(#gb-ah-green)"/>

  <!-- ============================================================
       STUFE 3 — BAUM 3 (niedriger Fehler, gruen)
       Box: x 630..810 · y 80..230 · Mitte x = 720
       ============================================================ -->
  <rect x="630" y="80" width="180" height="150" rx="6" fill="#eaf7ee" stroke="#2e9e4f" stroke-width="3"/>
  <text x="720" y="119" font-family="Montserrat, Helvetica, sans-serif" font-size="19" font-weight="600"
        fill="#1e1e1e" text-anchor="middle">Baum 3</text>
  <!-- Restfehler 2 % = 11 px -->
  <rect x="650" y="141" width="140" height="14" rx="7" fill="#ffffff" stroke="#e8e8e8" stroke-width="1.5"/>
  <rect x="650" y="141" width="14" height="14" rx="7" fill="#2e9e4f"/>
  <text x="720" y="192" font-family="Montserrat, Helvetica, sans-serif" font-size="15" font-weight="600"
        fill="#2e9e4f" text-anchor="middle">Restfehler: 2 %</text>
  <text x="720" y="213" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5"
        fill="#757575" text-anchor="middle">feiner Nachschliff</text>

  <!-- ============================================================
       ZUSAMMENFUEHRUNG — alle Baeume addieren sich zum Ensemble
       Sammelschiene auf y = 300, Abzweig nach unten bei x = 450
       ============================================================ -->
  <g fill="none" stroke="#757575" stroke-width="3" stroke-linecap="round">
    <path d="M 180 234 V 288 Q 180 300 192 300 H 450"/>
    <path d="M 720 234 V 288 Q 720 300 708 300 H 450"/>
    <path d="M 450 234 V 300"/>
  </g>
  <line x1="450" y1="300" x2="450" y2="344" stroke="#00c6b2" stroke-width="4"
        marker-end="url(#gb-ah-teal)"/>
  <text x="466" y="330" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5"
        fill="#757575">Summe der gewichteten Vorhersagen</text>

  <!-- ============================================================
       ERGEBNIS — finale Ensemble-Vorhersage (Teal hervorgehoben)
       ============================================================ -->
  <rect x="220" y="352" width="460" height="104" rx="6" fill="#e9f8f6" stroke="#00c6b2" stroke-width="3.5"/>
  <text x="450" y="392" font-family="Montserrat, Helvetica, sans-serif" font-size="19" font-weight="600"
        fill="#1e1e1e" text-anchor="middle">Finale Ensemble-Vorhersage</text>
  <text x="450" y="424" font-family="Montserrat, Helvetica, sans-serif" font-size="17" font-weight="600"
        fill="#00a294" text-anchor="middle">Gesamtfehler: 2 %</text>
  <text x="450" y="445" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5"
        fill="#757575" text-anchor="middle">Baum 1 + Baum 2 + Baum 3 — sequenziell statt parallel</text>
</svg>
