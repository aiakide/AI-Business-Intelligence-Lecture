    <text x="200.7" y="318.7">-2</text>
    <line x1="331.3" y1="295.7" x2="331.3" y2="303.7" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="331.3" y="318.7">2</text>
    <line x1="396.7" y1="295.7" x2="396.7" y2="303.7" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="396.7" y="318.7">4</text>
    <line x1="462.0" y1="295.7" x2="462.0" y2="303.7" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="462.0" y="318.7">6</text>
  </g>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="end">
    <line x1="58.0" y1="299.7" x2="472.0" y2="299.7" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="50.0" y="303.7">0</text>
    <line x1="58.0" y1="207.0" x2="472.0" y2="207.0" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="50.0" y="211.0">0,5</text>
    <line x1="58.0" y1="114.3" x2="472.0" y2="114.3" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="50.0" y="118.3">1</text>
  </g>
