    <line x1="368.0" y1="96.0" x2="660.0" y2="96.0" stroke="#dcdcdc" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="362.0" y="100.0">0,4</text>
    <line x1="368.0" y1="213.0" x2="660.0" y2="213.0" stroke="#dcdcdc" stroke-width="1.5" stroke-dasharray="5 4" />
