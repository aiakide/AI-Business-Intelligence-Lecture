  <!-- Softmax-Transformation -->
  <line x1="336.0" y1="200" x2="364.0" y2="200" stroke="#00c6b2" stroke-width="2.5" stroke-linecap="round" marker-end="url(#smx-arrow)" />
  <text x="350.0" y="186" font-family="Montserrat, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#00a294" text-anchor="middle">softmax</text>
  <rect x="429.0" y="382.0" width="176" height="30" rx="4" fill="#00c6b2" />
  <text x="517.0" y="402.0" font-family="Montserrat, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Summe aller Balken = 1</text>
