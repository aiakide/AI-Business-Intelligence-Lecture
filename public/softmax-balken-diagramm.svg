  <text x="197.3" y="175.1" font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="600" fill="#4a4a4a" text-anchor="middle">0,8</text>
  <rect x="216.9" y="159.8" width="18.0" height="63.8" rx="2" fill="#c4c4c4" />
