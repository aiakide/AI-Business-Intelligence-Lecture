<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 285" width="100%" height="auto" role="img"
     aria-label="Schematische Darstellung der K-Means-Grundidee in drei Schritten: drei zufaellig gesetzte Startpunkte in einem Punktefeld, danach schliesst sich jeder Punkt dem naechstgelegenen Startpunkt an und erhaelt dessen Farbe, zuletzt ruecken die Startpunkte in die Mitte ihrer jeweiligen Gruppe. Der Vorgang wiederholt sich, bis sich nichts mehr bewegt.">
  <title>K-Means: die Grundidee in drei Schritten</title>

  <defs>
    <marker id="move-arrow-0" markerWidth="7" markerHeight="7" refX="5.6" refY="2.6" orient="auto">
      <polygon points="0 0, 6.5 2.6, 0 5.2" fill="#00c6b2" />
    </marker>
    <marker id="move-arrow-1" markerWidth="7" markerHeight="7" refX="5.6" refY="2.6" orient="auto">
      <polygon points="0 0, 6.5 2.6, 0 5.2" fill="#e8734a" />
    </marker>
    <marker id="move-arrow-2" markerWidth="7" markerHeight="7" refX="5.6" refY="2.6" orient="auto">
      <polygon points="0 0, 6.5 2.6, 0 5.2" fill="#5a7d9a" />
    </marker>
  </defs>

  <!-- ============ PANEL 1 - Zufaelliger Start ============ -->
  <g>
  <rect x="20.0" y="22.0" width="320" height="180.0" rx="4" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.5" />
    <!-- Punktefeld ohne Zuordnung -->
    <circle cx="80.1" cy="78.7" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="112.1" cy="64.2" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="87.9" cy="106.8" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="121.8" cy="98.2" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="262.5" cy="72.8" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="299.4" cy="61.7" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="274.1" cy="104.2" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="309.1" cy="94.0" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="165.5" cy="168.8" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="202.4" cy="153.5" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="180.0" cy="187.5" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <circle cx="218.8" cy="174.8" r="5.4" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" />
    <!-- drei zufaellig gesetzte Startpunkte -->
    <polygon points="121.8,134.0 132.8,145.0 121.8,156.0 110.8,145.0" fill="#00c6b2" stroke="#ffffff" stroke-width="2" /><circle cx="121.8" cy="145.0" r="2.2" fill="#ffffff" />
    <polygon points="175.2,108.5 186.2,119.5 175.2,130.5 164.2,119.5" fill="#e8734a" stroke="#ffffff" stroke-width="2" /><circle cx="175.2" cy="119.5" r="2.2" fill="#ffffff" />
    <polygon points="144.2,174.8 155.2,185.8 144.2,196.8 133.2,185.8" fill="#5a7d9a" stroke="#ffffff" stroke-width="2" /><circle cx="144.2" cy="185.8" r="2.2" fill="#ffffff" />
  </g>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="180.0" y="228.0" font-weight="700" fill="#1e1e1e">1. Drei zufällige Startpunkte</text>
  </g>

  <!-- ============ PANEL 2 - Jeder Punkt zum naechsten Startpunkt ============ -->
  <g>
  <rect x="380.0" y="22.0" width="320" height="180.0" rx="4" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.5" />
    <!-- feine Verbindungslinien Punkt -> Startpunkt -->
    <line x1="440.1" y1="78.7" x2="481.9" y2="145.0" stroke="#00c6b2" stroke-width="1" opacity="0.35" />
    <line x1="472.1" y1="64.2" x2="535.2" y2="119.5" stroke="#e8734a" stroke-width="1" opacity="0.35" />
    <line x1="447.9" y1="106.8" x2="481.9" y2="145.0" stroke="#00c6b2" stroke-width="1" opacity="0.35" />
    <line x1="481.9" y1="98.2" x2="481.9" y2="145.0" stroke="#00c6b2" stroke-width="1" opacity="0.35" />
    <line x1="622.5" y1="72.8" x2="535.2" y2="119.5" stroke="#e8734a" stroke-width="1" opacity="0.35" />
    <line x1="659.4" y1="61.7" x2="535.2" y2="119.5" stroke="#e8734a" stroke-width="1" opacity="0.35" />
    <line x1="634.1" y1="104.2" x2="535.2" y2="119.5" stroke="#e8734a" stroke-width="1" opacity="0.35" />
    <line x1="669.1" y1="94.0" x2="535.2" y2="119.5" stroke="#e8734a" stroke-width="1" opacity="0.35" />
    <line x1="525.5" y1="168.8" x2="504.2" y2="185.8" stroke="#5a7d9a" stroke-width="1" opacity="0.35" />
    <line x1="562.4" y1="153.5" x2="535.2" y2="119.5" stroke="#e8734a" stroke-width="1" opacity="0.35" />
    <line x1="540.0" y1="187.5" x2="504.2" y2="185.8" stroke="#5a7d9a" stroke-width="1" opacity="0.35" />
    <line x1="578.9" y1="174.8" x2="504.2" y2="185.8" stroke="#5a7d9a" stroke-width="1" opacity="0.35" />
    <!-- Punkte, nach Zugehoerigkeit eingefaerbt (Farbe + Form) -->
    <circle cx="440.1" cy="78.7" r="5.4" fill="#00c6b2" stroke="#ffffff" stroke-width="1.4" />
    <rect x="467.3" y="59.4" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <circle cx="447.9" cy="106.8" r="5.4" fill="#00c6b2" stroke="#ffffff" stroke-width="1.4" />
    <circle cx="481.9" cy="98.2" r="5.4" fill="#00c6b2" stroke="#ffffff" stroke-width="1.4" />
    <rect x="617.7" y="68.0" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <rect x="654.6" y="56.9" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <rect x="629.3" y="99.4" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <rect x="664.3" y="89.2" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <polygon points="525.5,162.2 531.7,173.6 519.3,173.6" fill="#5a7d9a" stroke="#ffffff" stroke-width="1.4" />
    <rect x="557.6" y="148.7" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <polygon points="540.0,180.9 546.2,192.3 533.8,192.3" fill="#5a7d9a" stroke="#ffffff" stroke-width="1.4" />
    <polygon points="578.9,168.2 585.1,179.6 572.7,179.6" fill="#5a7d9a" stroke="#ffffff" stroke-width="1.4" />
    <!-- Startpunkte unveraendert -->
    <polygon points="481.9,134.0 492.9,145.0 481.9,156.0 470.9,145.0" fill="#00c6b2" stroke="#ffffff" stroke-width="2" /><circle cx="481.9" cy="145.0" r="2.2" fill="#ffffff" />
    <polygon points="535.2,108.5 546.2,119.5 535.2,130.5 524.2,119.5" fill="#e8734a" stroke="#ffffff" stroke-width="2" /><circle cx="535.2" cy="119.5" r="2.2" fill="#ffffff" />
    <polygon points="504.2,174.8 515.2,185.8 504.2,196.8 493.2,185.8" fill="#5a7d9a" stroke="#ffffff" stroke-width="2" /><circle cx="504.2" cy="185.8" r="2.2" fill="#ffffff" />
  </g>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="540.0" y="228.0" font-weight="700" fill="#1e1e1e">2. Jeder Punkt schließt sich dem</text>
    <text x="540.0" y="245.0" font-weight="500" fill="#4a4a4a">nächsten Startpunkt an</text>
  </g>

  <!-- ============ PANEL 3 - Startpunkte ruecken in die Gruppenmitte ============ -->
  <g>
  <rect x="740.0" y="22.0" width="320" height="180.0" rx="4" fill="#fbfbfb" stroke="#e8e8e8" stroke-width="1.5" />
    <!-- Punkte behalten ihre Zuordnung -->
    <circle cx="800.1" cy="78.7" r="5.4" fill="#00c6b2" stroke="#ffffff" stroke-width="1.4" />
    <rect x="827.3" y="59.4" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <circle cx="807.9" cy="106.8" r="5.4" fill="#00c6b2" stroke="#ffffff" stroke-width="1.4" />
    <circle cx="841.9" cy="98.2" r="5.4" fill="#00c6b2" stroke="#ffffff" stroke-width="1.4" />
    <rect x="977.7" y="68.0" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <rect x="1014.6" y="56.9" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <rect x="989.3" y="99.4" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <rect x="1024.3" y="89.2" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <polygon points="885.5,162.2 891.7,173.6 879.3,173.6" fill="#5a7d9a" stroke="#ffffff" stroke-width="1.4" />
    <rect x="917.6" y="148.7" width="9.6" height="9.6" rx="1.2" fill="#e8734a" stroke="#ffffff" stroke-width="1.4" />
    <polygon points="900.0,180.9 906.2,192.3 893.8,192.3" fill="#5a7d9a" stroke="#ffffff" stroke-width="1.4" />
    <polygon points="938.9,168.2 945.1,179.6 932.7,179.6" fill="#5a7d9a" stroke="#ffffff" stroke-width="1.4" />
    <!-- alte Positionen (gestrichelt) -->
    <polygon points="841.9,134.0 852.9,145.0 841.9,156.0 830.9,145.0" fill="#ffffff" fill-opacity="0.9" stroke="#00c6b2" stroke-width="1.6" stroke-dasharray="3 2.5" opacity="0.8" />
    <polygon points="895.2,108.5 906.2,119.5 895.2,130.5 884.2,119.5" fill="#ffffff" fill-opacity="0.9" stroke="#e8734a" stroke-width="1.6" stroke-dasharray="3 2.5" opacity="0.8" />
    <polygon points="864.2,174.8 875.2,185.8 864.2,196.8 853.2,185.8" fill="#ffffff" fill-opacity="0.9" stroke="#5a7d9a" stroke-width="1.6" stroke-dasharray="3 2.5" opacity="0.8" />
    <!-- Bewegung zur neuen Position -->
    <line x1="836.1" y1="133.4" x2="823.3" y2="108.0" stroke="#00c6b2" stroke-width="2" stroke-linecap="round" marker-end="url(#move-arrow-0)" />
    <line x1="907.2" y1="114.6" x2="949.4" y2="97.4" stroke="#e8734a" stroke-width="2" stroke-linecap="round" marker-end="url(#move-arrow-1)" />
    <line x1="876.9" y1="183.2" x2="893.4" y2="179.9" stroke="#5a7d9a" stroke-width="2" stroke-linecap="round" marker-end="url(#move-arrow-2)" />
    <!-- neue Positionen -->
    <polygon points="816.6,83.6 827.6,94.6 816.6,105.6 805.6,94.6" fill="#00c6b2" stroke="#ffffff" stroke-width="2" /><circle cx="816.6" cy="94.6" r="2.2" fill="#ffffff" />
    <polygon points="963.3,80.7 974.3,91.7 963.3,102.7 952.3,91.7" fill="#e8734a" stroke="#ffffff" stroke-width="2" /><circle cx="963.3" cy="91.7" r="2.2" fill="#ffffff" />
    <polygon points="908.1,166.0 919.1,177.0 908.1,188.0 897.1,177.0" fill="#5a7d9a" stroke="#ffffff" stroke-width="2" /><circle cx="908.1" cy="177.0" r="2.2" fill="#ffffff" />
  </g>
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="900.0" y="228.0" font-weight="700" fill="#1e1e1e">3. Startpunkte rücken in die Mitte</text>
    <text x="900.0" y="245.0" font-weight="500" fill="#4a4a4a">ihrer Gruppe — bis nichts mehr bewegt</text>
  </g>
</svg>
