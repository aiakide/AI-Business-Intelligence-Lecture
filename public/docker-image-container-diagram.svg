<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 412" width="100%" height="auto"
     role="img" aria-label="Ein Docker-Image als Bauplan erzeugt per docker run drei identische, isolierte Container auf Laptop, Server und Cloud">

  <title>Docker-Image und Container</title>
  <desc>Ein unveraenderliches Docker-Image mit Python 3.11, pandas 2.0, scikit-learn 1.3 und dem Betrugserkennungs-Code erzeugt per "docker run" drei identische Running Container auf Laptop, Server und Cloud.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#00c6b2" />
    </marker>
  </defs>

  <style>
    .t   { font-family: Montserrat, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .hd  { font-size: 17px; font-weight: 700; fill: #1e1e1e; }
    .sub { font-size: 11.5px; fill: #757575; }
    .pill{ font-size: 10px; font-weight: 600; fill: #1e1e1e; }
    .cpill { font-size: 9.5px; font-weight: 600; fill: #1e1e1e; }
    .chd { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .ok  { font-size: 10.5px; font-weight: 700; fill: #00c6b2; }
    .run { font-size: 12px; font-weight: 700; fill: #00c6b2; }
    .host{ font-size: 11px; font-weight: 600; fill: #757575; }
  </style>

  <!-- ============ Quelle: Docker-Image (Bauplan) ============ -->
  <rect x="190" y="14" width="440" height="112" rx="6" fill="#f5f5f5" stroke="#00c6b2" stroke-width="2.5" />
  <text class="t hd"  x="410" y="40" text-anchor="middle">Docker-Image</text>
  <text class="t sub" x="410" y="58" text-anchor="middle">Bauplan &#8211; einmal gebaut, unver&#228;nderlich</text>

  <!-- Inhalt des Images -->
  <g>
    <rect x="206" y="76" width="96" height="26" rx="4" fill="#bff1ec" stroke="#00c6b2" stroke-width="1.2" />
    <text class="t pill" x="254" y="93" text-anchor="middle">Python 3.11</text>

    <rect x="310" y="76" width="96" height="26" rx="4" fill="#bff1ec" stroke="#00c6b2" stroke-width="1.2" />
    <text class="t pill" x="358" y="93" text-anchor="middle">pandas 2.0</text>

    <rect x="414" y="76" width="96" height="26" rx="4" fill="#bff1ec" stroke="#00c6b2" stroke-width="1.2" />
    <text class="t pill" x="462" y="93" text-anchor="middle">scikit-learn 1.3</text>

    <rect x="518" y="76" width="96" height="26" rx="4" fill="#bff1ec" stroke="#00c6b2" stroke-width="1.2" />
    <text class="t pill" x="566" y="93" text-anchor="middle">Modell-Code</text>
  </g>

  <!-- ============ Fan-out: docker run ============ -->
  <!-- Stamm -->
  <line x1="410" y1="126" x2="410" y2="176" stroke="#00c6b2" stroke-width="2.5" />
  <!-- Verteilerbalken -->
  <line x1="140" y1="176" x2="680" y2="176" stroke="#00c6b2" stroke-width="2.5" />
  <!-- Abzweige zu den drei Containern -->
  <line x1="140" y1="176" x2="140" y2="214" stroke="#00c6b2" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="410" y1="176" x2="410" y2="214" stroke="#00c6b2" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="680" y1="176" x2="680" y2="214" stroke="#00c6b2" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Label auf dem Stamm -->
  <rect x="356" y="140" width="108" height="24" rx="4" fill="#ffffff" stroke="#00c6b2" stroke-width="2" />
  <text class="t run" x="410" y="156" text-anchor="middle">docker run</text>

  <!-- ============ Container 1: Laptop ============ -->
  <g>
    <rect x="30" y="218" width="220" height="134" rx="6" fill="#ffffff" stroke="#00c6b2" stroke-width="2" />
    <path d="M30 224 a6 6 0 0 1 6 -6 h208 a6 6 0 0 1 6 6 v22 h-220 z" fill="#00c6b2" />
    <text class="t chd" x="140" y="238" text-anchor="middle">Running Container</text>

    <rect x="44"  y="256" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="89"  y="271" text-anchor="middle">Python 3.11</text>
    <rect x="146" y="256" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="191" y="271" text-anchor="middle">pandas 2.0</text>
    <rect x="44"  y="284" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="89"  y="299" text-anchor="middle">scikit-learn 1.3</text>
    <rect x="146" y="284" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="191" y="299" text-anchor="middle">Modell-Code</text>

    <text class="t ok" x="140" y="333" text-anchor="middle">&#10003; gleiches Resultat</text>
  </g>

  <!-- ============ Container 2: Server ============ -->
  <g>
    <rect x="300" y="218" width="220" height="134" rx="6" fill="#ffffff" stroke="#00c6b2" stroke-width="2" />
    <path d="M300 224 a6 6 0 0 1 6 -6 h208 a6 6 0 0 1 6 6 v22 h-220 z" fill="#00c6b2" />
    <text class="t chd" x="410" y="238" text-anchor="middle">Running Container</text>

    <rect x="314" y="256" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="359" y="271" text-anchor="middle">Python 3.11</text>
    <rect x="416" y="256" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="461" y="271" text-anchor="middle">pandas 2.0</text>
    <rect x="314" y="284" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="359" y="299" text-anchor="middle">scikit-learn 1.3</text>
    <rect x="416" y="284" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="461" y="299" text-anchor="middle">Modell-Code</text>

    <text class="t ok" x="410" y="333" text-anchor="middle">&#10003; gleiches Resultat</text>
  </g>

  <!-- ============ Container 3: Cloud ============ -->
  <g>
    <rect x="570" y="218" width="220" height="134" rx="6" fill="#ffffff" stroke="#00c6b2" stroke-width="2" />
    <path d="M570 224 a6 6 0 0 1 6 -6 h208 a6 6 0 0 1 6 6 v22 h-220 z" fill="#00c6b2" />
    <text class="t chd" x="680" y="238" text-anchor="middle">Running Container</text>

    <rect x="584" y="256" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="629" y="271" text-anchor="middle">Python 3.11</text>
    <rect x="686" y="256" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="731" y="271" text-anchor="middle">pandas 2.0</text>
    <rect x="584" y="284" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="629" y="299" text-anchor="middle">scikit-learn 1.3</text>
    <rect x="686" y="284" width="90" height="22" rx="4" fill="#f5f5f5" stroke="#bff1ec" stroke-width="1.2" />
    <text class="t cpill" x="731" y="299" text-anchor="middle">Modell-Code</text>

    <text class="t ok" x="680" y="333" text-anchor="middle">&#10003; gleiches Resultat</text>
  </g>

  <!-- ============ Host-Symbole ============ -->
  <!-- Laptop -->
  <g fill="#757575">
    <rect x="126" y="358" width="28" height="18" rx="2" />
    <rect x="128.5" y="360.5" width="23" height="13" fill="#ffffff" />
    <polygon points="121,379 159,379 155,375.5 125,375.5" />
  </g>
  <text class="t host" x="140" y="396" text-anchor="middle">Laptop (Entwicklung)</text>

  <!-- Server -->
  <g fill="#757575">
    <rect x="396" y="357"   width="28" height="6.5" rx="2" />
    <rect x="396" y="365.5" width="28" height="6.5" rx="2" />
    <rect x="396" y="374"   width="28" height="6.5" rx="2" />
    <circle cx="401" cy="360.2" r="1.4" fill="#ffffff" />
    <circle cx="401" cy="368.7" r="1.4" fill="#ffffff" />
    <circle cx="401" cy="377.2" r="1.4" fill="#ffffff" />
  </g>
  <text class="t host" x="410" y="396" text-anchor="middle">Server (Rechenzentrum)</text>

  <!-- Cloud -->
  <g fill="#757575">
    <circle cx="672" cy="371" r="7" />
    <circle cx="681" cy="366.5" r="9.5" />
    <circle cx="691" cy="372" r="6.5" />
    <rect x="665" y="372" width="30" height="7" rx="3.5" />
  </g>
  <text class="t host" x="680" y="396" text-anchor="middle">Cloud (Deployment)</text>

</svg>
