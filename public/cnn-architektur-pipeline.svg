<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 288" width="100%" height="auto" role="img"
     aria-label="Komplette CNN-Pipeline: Aus dem Eingabebild 224 mal 224 mal 3 macht Conv-Block 1 eine Feature-Map-Sammlung 112 mal 112 mal 32, Conv-Block 2 daraus 56 mal 56 mal 64 und Conv-Block 3 schließlich 28 mal 28 mal 128. Die Blöcke werden räumlich kleiner, aber tiefer. Danach flacht Flatten die Karten zu 100.352 Werten ab, eine Dense-Schicht mit 512 Neuronen folgt, am Ende gibt eine Dense-Schicht mit 10 Neuronen und Softmax die Klassenwahrscheinlichkeiten aus. Insgesamt rund 1 Million Parameter.">
  <title>CNN-Architektur: von Merkmalsextraktion bis Klassifikation</title>

  <defs>
    <marker id="cnn-arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#00c6b2" />
    </marker>
  </defs>

  <rect x="20" y="12" width="128" height="24" rx="4" fill="#00c6b2" />
  <text x="84" y="28.5" font-family="Montserrat, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CNN-Pipeline</text>
  <text x="160" y="29" font-family="Montserrat, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="start">Räumlich kleiner, dafür tiefer — dann klassifizieren</text>
  <line x1="96" y1="152" x2="780" y2="152" stroke="#00c6b2" stroke-width="2" marker-end="url(#cnn-arrow)" />

  <!-- ===================== Input ===================== -->
  <rect x="20" y="104" width="76" height="76" rx="3" fill="#eaf0fc" stroke="#3a5fa8" stroke-width="1.8" />
  <g stroke="#3a5fa8" stroke-width="2" fill="none" stroke-linejoin="round">
    <path d="M 32 156 L 36 138 L 62 138 L 72 152 L 84 154 L 84 160 L 32 160 Z" fill="#c9d8f5" />
    <circle cx="46" cy="162" r="6" fill="#ffffff" />
    <circle cx="74" cy="162" r="6" fill="#ffffff" />
  </g>

  <!-- ===================== Conv-Blöcke ===================== -->
  <rect x="110" y="140" width="80" height="40" rx="4" fill="#ffffff" stroke="#00c6b2" stroke-width="1.5" />
  <text x="150" y="156" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#1e1e1e" text-anchor="middle">Conv 3×3 · 32</text>
  <text x="150" y="170" font-family="Montserrat, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#6b6b6b" text-anchor="middle">ReLU + MaxPool</text>
  <rect x="224" y="92" width="64" height="64" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="218" y="98" width="64" height="64" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="212" y="104" width="64" height="64" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="206" y="110" width="64" height="64" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="200" y="116" width="64" height="64" rx="2" fill="#ffffff" stroke="#00c6b2" stroke-width="2" />
  <rect x="296" y="140" width="80" height="40" rx="4" fill="#ffffff" stroke="#00c6b2" stroke-width="1.5" />
  <text x="336" y="156" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#1e1e1e" text-anchor="middle">Conv 3×3 · 64</text>
  <text x="336" y="170" font-family="Montserrat, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#6b6b6b" text-anchor="middle">ReLU + MaxPool</text>
  <rect x="422" y="92" width="52" height="52" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="416" y="98" width="52" height="52" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="410" y="104" width="52" height="52" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="404" y="110" width="52" height="52" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="398" y="116" width="52" height="52" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="392" y="122" width="52" height="52" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="386" y="128" width="52" height="52" rx="2" fill="#ffffff" stroke="#00c6b2" stroke-width="2" />
  <rect x="482" y="140" width="80" height="40" rx="4" fill="#ffffff" stroke="#00c6b2" stroke-width="1.5" />
  <text x="522" y="156" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#1e1e1e" text-anchor="middle">Conv 3×3 · 128</text>
  <text x="522" y="170" font-family="Montserrat, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#6b6b6b" text-anchor="middle">ReLU + MaxPool</text>
  <rect x="612" y="100" width="40" height="40" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="607" y="105" width="40" height="40" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="602" y="110" width="40" height="40" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="597" y="115" width="40" height="40" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="592" y="120" width="40" height="40" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="587" y="125" width="40" height="40" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="582" y="130" width="40" height="40" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="577" y="135" width="40" height="40" rx="2" fill="#e0f7f4" stroke="#7fdfd5" stroke-width="1.2" />
  <rect x="572" y="140" width="40" height="40" rx="2" fill="#ffffff" stroke="#00c6b2" stroke-width="2" />

  <!-- ===================== Flatten & Dense ===================== -->
  <rect x="662" y="140" width="60" height="40" rx="4" fill="#ffffff" stroke="#00c6b2" stroke-width="1.5" />
  <text x="692" y="164" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#1e1e1e" text-anchor="middle">Flatten</text>
  <rect x="732" y="96" width="24" height="84" rx="4" fill="#e0f7f4" stroke="#00c6b2" stroke-width="1.8" />
  <line x1="732" y1="108" x2="756" y2="108" stroke="#7fdfd5" stroke-width="1" />
  <line x1="732" y1="120" x2="756" y2="120" stroke="#7fdfd5" stroke-width="1" />
  <line x1="732" y1="132" x2="756" y2="132" stroke="#7fdfd5" stroke-width="1" />
  <line x1="732" y1="144" x2="756" y2="144" stroke="#7fdfd5" stroke-width="1" />
  <line x1="732" y1="156" x2="756" y2="156" stroke="#7fdfd5" stroke-width="1" />
  <line x1="732" y1="168" x2="756" y2="168" stroke="#7fdfd5" stroke-width="1" />
  <rect x="786" y="120" width="24" height="60" rx="4" fill="#ffffff" stroke="#00c6b2" stroke-width="1.8" />
  <line x1="786" y1="132" x2="810" y2="132" stroke="#cfeeea" stroke-width="1" />
  <line x1="786" y1="144" x2="810" y2="144" stroke="#cfeeea" stroke-width="1" />
  <line x1="786" y1="156" x2="810" y2="156" stroke="#cfeeea" stroke-width="1" />
  <line x1="786" y1="168" x2="810" y2="168" stroke="#cfeeea" stroke-width="1" />
  <rect x="786" y="144" width="24" height="12" fill="#00c6b2" />

  <!-- ===================== Beschriftungen ===================== -->
  <text x="58" y="200" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e1e1e" text-anchor="middle">Input</text>
  <text x="58" y="214" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#00998a" text-anchor="middle">224 × 224 × 3</text>
  <text x="243" y="200" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e1e1e" text-anchor="middle">Conv-Block 1</text>
  <text x="243" y="214" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#00998a" text-anchor="middle">112 × 112 × 32</text>
  <text x="429" y="200" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e1e1e" text-anchor="middle">Conv-Block 2</text>
  <text x="429" y="214" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#00998a" text-anchor="middle">56 × 56 × 64</text>
  <text x="612" y="200" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e1e1e" text-anchor="middle">Conv-Block 3</text>
  <text x="612" y="214" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#00998a" text-anchor="middle">28 × 28 × 128</text>
  <text x="692" y="200" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e1e1e" text-anchor="middle">Flatten</text>
  <text x="692" y="214" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#00998a" text-anchor="middle">100.352</text>
  <text x="744" y="200" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e1e1e" text-anchor="middle">Dense</text>
  <text x="744" y="214" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#00998a" text-anchor="middle">512</text>
  <text x="796" y="200" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1e1e1e" text-anchor="middle">Softmax</text>
  <text x="796" y="214" font-family="Montserrat, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#00998a" text-anchor="middle">10 Klassen</text>

  <!-- ===================== Phasen-Klammern ===================== -->
  <path d="M 20 238 L 20 230 L 652 230 L 652 238" fill="none" stroke="#bdbdbd" stroke-width="1.5" />
  <text x="336" y="254" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#4a4a4a" text-anchor="middle">Merkmalsextraktion — Conv + Pool (Kanten → Formen → Objektteile)</text>
  <path d="M 662 238 L 662 230 L 810 230 L 810 238" fill="none" stroke="#bdbdbd" stroke-width="1.5" />
  <text x="736" y="254" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#4a4a4a" text-anchor="middle">Klassifikation — Dense</text>
  <text x="20" y="278" font-family="Montserrat, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#1e1e1e" text-anchor="start">≈ 1 Mio. Parameter — statt 19,3 Mio. für eine einzige Dense-Schicht direkt auf dem Rohbild.</text>
</svg>
