  <title id="tanhTitle">Tanh-Funktion: um null zentrierte S-Kurve zwischen minus 1 und plus 1</title>
  <desc id="tanhDesc">Der Graph des Tangens hyperbolicus f&#252;r z von minus 6 bis plus 6. Die Kurve hat dieselbe S-Form wie Sigmoid, verl&#228;uft aber zwischen minus 1 und plus 1 und geht bei z gleich 0 exakt durch den Ursprung. Zum Vergleich ist die Sigmoid-Kurve als d&#252;nne graue Linie eingezeichnet, die bei z gleich 0 den Wert 0,5 hat und damit nicht um null zentriert ist.</desc>

  <defs>
    <marker id="tanh-ax" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#757575" />
    </marker>
  </defs>

