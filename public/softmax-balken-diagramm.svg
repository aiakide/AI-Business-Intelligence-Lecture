  <rect x="493.7" y="318.3" width="18.0" height="11.7" rx="2" fill="#00c6b2" />
  <text x="502.7" y="312.3" font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="600" fill="#00a294" text-anchor="middle">0,02</text>
  <rect x="522.3" y="271.5" width="18.0" height="58.5" rx="2" fill="#00c6b2" />
  <text x="531.3" y="265.5" font-family="Montserrat, Helvetica, sans-serif" font-size="9.5" font-weight="600" fill="#00a294" text-anchor="middle">0,10</text>
  <rect x="550.9" y="224.7" width="18.0" height="105.3" rx="2" fill="#00c6b2" />
