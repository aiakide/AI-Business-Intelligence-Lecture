<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="100%" height="auto"
     role="img" aria-labelledby="lossTitle lossDesc">
  <title id="lossTitle">Loss-Kurve: Der Fehler sinkt im Verlauf des Trainings</title>
  <desc id="lossDesc">Ein Diagramm mit der Anzahl der Trainingsschritte auf der waagerechten Achse und dem
  Loss auf der senkrechten Achse. Die Kurve startet links bei einem Loss von etwa 3 &#8212; das Netz hat dort
  zuf&#228;llige Gewichte und macht gro&#223;e Fehler. Sie f&#228;llt zun&#228;chst steil, dann immer flacher ab und n&#228;hert sich
  rechts einem Wert nahe null an. Dort sind die Gewichte optimiert und der Fehler ist klein. Die Kurve f&#228;llt
  nicht linear, sondern exponentiell: die gr&#246;&#223;ten Fortschritte passieren am Anfang des Trainings.</desc>

  <defs>
    <marker id="loss-ax" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#757575" />
    </marker>
  </defs>

  <!-- ===================================================================
       ZONE HOHER FEHLER (links) — orange als Problemzone
       =================================================================== -->
  <rect x="90" y="78" width="86" height="232" rx="4" fill="#fbe4d5" opacity="0.5" />

  <!-- ===================================================================
       ACHSEN
       =================================================================== -->
  <line x1="76"  y1="310" x2="528" y2="310" stroke="#757575" stroke-width="2" marker-end="url(#loss-ax)" />
  <line x1="90"  y1="344" x2="90"  y2="76"  stroke="#757575" stroke-width="2" marker-end="url(#loss-ax)" />
  <text x="90"  y="66"  font-family="Montserrat, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#1e1e1e" text-anchor="middle">Loss</text>
  <text x="300" y="358" font-family="Montserrat, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e1e1e" text-anchor="middle">Trainingsschritte (Epochs)</text>

  <!-- Hilfslinien und Y-Beschriftung -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="end">
    <line x1="90" y1="241.4" x2="505" y2="241.4" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="82" y="245.4">1</text>
    <line x1="90" y1="172.9" x2="505" y2="172.9" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="82" y="176.9">2</text>
    <line x1="90" y1="104.3" x2="505" y2="104.3" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="82" y="108.3">3</text>
    <text x="82" y="314">0</text>
  </g>

  <!-- X-Ticks -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="11" fill="#4a4a4a" text-anchor="middle">
    <line x1="192.5" y1="306" x2="192.5" y2="314" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="192.5" y="330">250</text>
    <line x1="295" y1="306" x2="295" y2="314" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="295" y="330">500</text>
    <line x1="397.5" y1="306" x2="397.5" y2="314" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="397.5" y="330">750</text>
    <line x1="500" y1="306" x2="500" y2="314" stroke="#9e9e9e" stroke-width="1.5" />
    <text x="500" y="330">1.000</text>
  </g>

