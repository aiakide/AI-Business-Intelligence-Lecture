<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="100%" height="auto"
     role="img" aria-labelledby="chainTitle chainDesc">
  <title id="chainTitle">Kettenregel: der Gradient eines Gewichts als Produkt lokaler Ableitungen</title>
  <desc id="chainDesc">Vier Stationen sind wie Kettenglieder aneinandergereiht: das Gewicht w, die gewichtete
  Summe z gleich w mal x plus b, die Aktivierung a gleich Sigma von z, und der Loss L von a und y. Pfeile
  verbinden die Stationen von links nach rechts. Ueber jedem Pfeil steht die lokale Ableitung: Delta z nach
  Delta w, Delta a nach Delta z, Delta L nach Delta a. Unter der gesamten Kette spannt eine Klammer, die zeigt:
  Delta L nach Delta w ergibt sich als Produkt aus Delta L nach Delta a, Delta a nach Delta z und Delta z nach
  Delta w. Eine kleine Aenderung an w pflanzt sich Glied fuer Glied bis zum Loss fort.</desc>

  <defs>
    <marker id="ktr-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#00c6b2" />
    </marker>
  </defs>

  <!-- ===================================================================
       KETTENGLIEDER (Stationen)
       =================================================================== -->
  <!-- Station 1: w -->
  <rect x="20" y="90" width="150" height="90" rx="45" fill="#e8e8e8" stroke="#00c6b2" stroke-width="2.5" />
  <text x="95" y="146" font-family="Montserrat, Helvetica, sans-serif" font-size="30" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">w</text>
  <text x="95" y="70" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="700"
        fill="#4a4a4a" text-anchor="middle">Gewicht</text>

  <!-- Station 2: z -->
  <rect x="270" y="90" width="210" height="90" rx="45" fill="#ffffff" stroke="#00c6b2" stroke-width="2.5" />
  <text x="375" y="146" font-family="Montserrat, Helvetica, sans-serif" font-size="22" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">z = w&#183;x + b</text>
  <text x="375" y="70" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="700"
        fill="#4a4a4a" text-anchor="middle">gewichtete Summe</text>

  <!-- Station 3: a -->
  <rect x="580" y="90" width="170" height="90" rx="45" fill="#bff1ec" stroke="#00c6b2" stroke-width="2.5" />
  <text x="665" y="146" font-family="Montserrat, Helvetica, sans-serif" font-size="22" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">a = &#963;(z)</text>
  <text x="665" y="70" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="700"
        fill="#4a4a4a" text-anchor="middle">Aktivierung</text>

  <!-- Station 4: L -->
  <rect x="850" y="90" width="110" height="90" rx="45" fill="#fbe4d5" stroke="#e07a3f" stroke-width="3" />
  <text x="905" y="146" font-family="Montserrat, Helvetica, sans-serif" font-size="20" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">L(a, y)</text>
  <text x="905" y="70" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="700"
        fill="#c25f28" text-anchor="middle">Loss</text>

  <!-- ===================================================================
       VERBINDUNGSPFEILE MIT KETTEN-GELENKEN
       =================================================================== -->
  <g stroke="#00c6b2" stroke-width="3" stroke-linecap="round">
    <line x1="178" y1="135" x2="260" y2="135" marker-end="url(#ktr-arrow)" />
    <line x1="488" y1="135" x2="570" y2="135" marker-end="url(#ktr-arrow)" />
    <line x1="758" y1="135" x2="840" y2="135" marker-end="url(#ktr-arrow)" />
  </g>
  <g fill="#ffffff" stroke="#00c6b2" stroke-width="2.5">
    <circle cx="170" cy="135" r="7" />
    <circle cx="270" cy="135" r="7" />
    <circle cx="480" cy="135" r="7" />
    <circle cx="580" cy="135" r="7" />
    <circle cx="750" cy="135" r="7" />
    <circle cx="850" cy="135" r="7" />
  </g>

  <!-- Lokale Ableitungen ueber den Pfeilen -->
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="17" font-weight="700"
     fill="#00a294" text-anchor="middle">
    <text x="219" y="120">&#8706;z/&#8706;w</text>
    <text x="529" y="120">&#8706;a/&#8706;z</text>
    <text x="799" y="120">&#8706;L/&#8706;a</text>
  </g>

  <!-- ===================================================================
       KLAMMER UEBER DIE GESAMTE KETTE + FORMEL
       =================================================================== -->
  <path d="M 95,205 C 250,205 350,230 500,230 C 650,230 750,205 905,205"
        fill="none" stroke="#e07a3f" stroke-width="2.5" stroke-linecap="round" />
  <line x1="500" y1="230" x2="500" y2="248" stroke="#e07a3f" stroke-width="2.5" stroke-linecap="round" />

  <text x="500" y="280" font-family="Montserrat, Helvetica, sans-serif" font-size="23" font-weight="700"
        fill="#1e1e1e" text-anchor="middle">
    <tspan fill="#c25f28">&#8706;L/&#8706;w</tspan>
    <tspan> = </tspan>
    <tspan fill="#00a294">&#8706;L/&#8706;a</tspan>
    <tspan> &#183; </tspan>
    <tspan fill="#00a294">&#8706;a/&#8706;z</tspan>
    <tspan> &#183; </tspan>
    <tspan fill="#00a294">&#8706;z/&#8706;w</tspan>
  </text>

  <text x="500" y="304" font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" font-weight="600"
        fill="#4a4a4a" text-anchor="middle">Die drei lokalen Ableitungen werden multipliziert &#8212; nicht addiert.</text>

  <!-- ===================================================================
       BILDUNTERSCHRIFT
       =================================================================== -->
  <line x1="140" y1="326" x2="860" y2="326" stroke="#e8e8e8" stroke-width="1" />
  <g font-family="Montserrat, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" fill="#4a4a4a">
    <text x="500" y="350">
      <tspan font-weight="700" fill="#1e1e1e">Die Kette traegt den Effekt weiter:</tspan>
      eine kleine &#196;nderung an w pflanzt sich Glied f&#252;r Glied fort,
    </text>
    <text x="500" y="368">bis sie am Loss ankommt &#8212; die Kettenregel berechnet genau diesen fortgepflanzten Effekt.</text>
  </g>
</svg>
