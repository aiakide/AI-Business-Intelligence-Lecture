<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="auto"
     role="img" aria-labelledby="titleGit descGit">
  <title id="titleGit">Git-Modell: Commit, Branch und Merge</title>
  <desc id="descGit">Ein Commit-Graph: Auf der Hauptlinie main liegen drei Commits nebeneinander.
  Am dritten Commit zweigt der Branch fix/raw-data-encoding ab, traegt zwei eigene Commits
  (fix: encoding und test: import) und wird spaeter als Merge-Commit wieder in main zusammengefuehrt.
  Danach folgt auf main ein weiterer Commit. Die Zeit laeuft von links nach rechts.</desc>

  <defs>
    <marker id="git-ah-dark" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#1e1e1e"/>
    </marker>
    <marker id="git-ah-grey" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 8 2.5, 0 5" fill="#757575"/>
    </marker>
  </defs>

  <style>
    .t    { font-family: Montserrat, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .m    { font-family: "Fira Code", "SFMono-Regular", Consolas, monospace; }
    .msg  { font-size: 11px; font-weight: 500; fill: #1e1e1e; }
    .msgb { font-size: 11px; font-weight: 500; fill: #00C6B2; }
    .br   { font-size: 12px; font-weight: 600; }
    .lg   { font-size: 11px; fill: #757575; }
    .ax   { font-size: 11px; font-weight: 600; fill: #757575; }
  </style>

  <!-- ================= Feature-Branch (teal) ================= -->
  <!-- Abzweig bei Commit 3, parallele Linie, Ruecklauf in den Merge-Commit -->
  <path d="M255 150 C 295 150, 300 70, 340 70 L 605 70 C 645 70, 650 150, 690 150"
        fill="none" stroke="#00C6B2" stroke-width="3" stroke-linecap="round"/>

  <!-- Branch-Commits -->
  <circle cx="395" cy="70" r="6.5" fill="#00C6B2"/>
  <circle cx="505" cy="70" r="6.5" fill="#00C6B2"/>
  <text class="m msgb" x="395" y="50" text-anchor="middle">fix: encoding</text>
  <text class="m msgb" x="505" y="50" text-anchor="middle">test: import</text>

  <!-- Branch-Name direkt auf der Linie -->
  <rect x="302" y="86" width="176" height="23" rx="4" fill="#ffffff" stroke="#00C6B2" stroke-width="2"/>
  <text class="m br" x="390" y="102" text-anchor="middle" fill="#00C6B2">fix/raw-data-encoding</text>

  <!-- ================= main-Linie (dunkel) ================= -->
  <line x1="45" y1="150" x2="866" y2="150" stroke="#1e1e1e" stroke-width="3"
        stroke-linecap="round" marker-end="url(#git-ah-dark)"/>

  <!-- Branch-Name main direkt auf der Linie -->
  <rect x="45" y="118" width="60" height="23" rx="4" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
  <text class="m br" x="75" y="134" text-anchor="middle" fill="#1e1e1e">main</text>

  <!-- Commits auf main -->
  <circle cx="95"  cy="150" r="6.5" fill="#1e1e1e"/>
  <circle cx="175" cy="150" r="6.5" fill="#1e1e1e"/>
  <circle cx="255" cy="150" r="6.5" fill="#1e1e1e"/>
  <circle cx="810" cy="150" r="6.5" fill="#1e1e1e"/>
  <text class="m msg" x="95"  y="174" text-anchor="middle">init</text>
  <text class="m msg" x="175" y="174" text-anchor="middle">import</text>
  <text class="m msg" x="255" y="174" text-anchor="middle">modell</text>
  <text class="m msg" x="810" y="174" text-anchor="middle">modell v2</text>

  <!-- ================= Merge-Commit ================= -->
  <circle cx="690" cy="150" r="10.5" fill="#00C6B2" stroke="#1e1e1e" stroke-width="2.5"/>
  <text class="m msg" x="690" y="178" text-anchor="middle" font-weight="700">Merge</text>

  <!-- ================= Legende + Zeitachse ================= -->
  <g>
    <!-- Commit -->
    <circle cx="51" cy="207" r="5.5" fill="#1e1e1e"/>
    <text class="t lg" x="63" y="211">Commit = Schnappschuss</text>

    <!-- Branch -->
    <path d="M215 212 C 223 212, 224 202, 232 202" fill="none" stroke="#00C6B2"
          stroke-width="2.5" stroke-linecap="round"/>
    <line x1="232" y1="202" x2="238" y2="202" stroke="#00C6B2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="212" y1="212" x2="238" y2="212" stroke="#1e1e1e" stroke-width="2.5" stroke-linecap="round"/>
    <text class="t lg" x="248" y="211">Branch = parallele Linie</text>

    <!-- Merge -->
    <circle cx="401" cy="207" r="7" fill="#00C6B2" stroke="#1e1e1e" stroke-width="2"/>
    <text class="t lg" x="415" y="211">Merge = Zusammenführen</text>
  </g>

  <!-- Zeitrichtung -->
  <text class="t ax" x="700" y="211" text-anchor="end">Zeit</text>
  <line x1="712" y1="207" x2="866" y2="207" stroke="#757575" stroke-width="1.8"
        marker-end="url(#git-ah-grey)"/>
</svg>
