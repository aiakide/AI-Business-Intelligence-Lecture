<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="auto"
     role="img" aria-labelledby="lrTitle lrDesc">
  <title id="lrTitle">Wirkung der Lernrate auf den Gradient Descent</title>
  <desc id="lrDesc">Drei nebeneinander liegende Panels zeigen dieselbe schüsselförmige Loss-Landschaft L von w. Links: eine zu kleine Lernrate erzeugt viele winzige Schritte, die das Minimum nach zehn Schritten noch nicht erreicht haben. Mitte: eine passende Lernrate führt mit vier gut bemessenen Schritten stabil in das Minimum. Rechts: eine zu große Lernrate überschießt das Minimum, springt im Zickzack auf die jeweils andere Seite der Schüssel und entfernt sich dabei immer weiter vom Tal – der Abstieg divergiert.</desc>

  <defs>
    <marker id="lr-ax" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#757575" />
    </marker>
    <marker id="lr-s1" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0, 9.5 4.5, 0 9" fill="#00776c" />
    </marker>
    <marker id="lr-s2" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0, 9.5 4.5, 0 9" fill="#00776c" />
    </marker>
    <marker id="lr-s3" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto">
      <polygon points="0 0, 9.5 4.5, 0 9" fill="#e07a3f" />
    </marker>
  </defs>

